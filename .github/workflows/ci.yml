name: CI

on:
  pull_request:
    # `labeled` asks for the tests (`ci-run`). `labeled`, `unlabeled` and
    # `edited` are here for the Desktop test gate below, which reads the PR's
    # labels AND its base branch: removing `desktop-tested` from a PR into
    # main must turn the check red again (#309), and a PR that passed on a
    # `beta` base and is then retargeted to `main` must be decided again
    # (`edited` is the only event a base change sends). Neither restarts the
    # tests: see the `concurrency` block and the `test` job's condition.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches: [main, beta, 'release/**']
  push:
    branches: [main]
  # Release level (P4.8; OD20 D7, WP1.71): the release-candidate Codex CLI is
  # checked on its own, dispatched with its version, besides the minimum and
  # pinned ones every run checks. On a dispatch the codex-conformance job runs,
  # with the always-on changelog check, probe-p19, probe-p21, snap-e2e and
  # remote-helper-e2e when the dispatch names them (probe_p19, probe_p21,
  # snap_e2e, remote_helper_e2e; snap_e2e_paste adds the Snap spec's clipboard
  # paste part to snap-e2e), paste-e2e when paste_e2e names its part, the
  # claude-conformance job when
  # claude_rc_version is set, and
  # the Helper job too when the `helper` input is set; every other job's
  # condition skips it.
  # The inputs reach a step through env, never a shell line.
  #
  # The daily upstream CLI watch (.github/workflows/upstream-cli-watch.yml,
  # aicc_planning#368) dispatches this workflow on beta with the newest published
  # Codex and Claude Code, when either is newer than the newest version the app
  # was tested with. It reads the result from the jobs named below
  # (`Codex CLI rc (<os>)`, `Claude Code CLI rc (<os>)`; scripts/ci/
  # upstream-cli-watch.mjs, held to these names by a test), so a rename of
  # either job or of an input here is a change to the watch as well.
  workflow_dispatch:
    inputs:
      # A dispatch that names `helper` also runs the Helper job and the arm64
      # Helper job (see their conditions), so a helper/ branch is built and tested
      # on all three systems, and on arm64 Linux, before its pull request opens.
      helper:
        description: 'Also build and test the session helper (the Helper job) on Windows, macOS and Linux at this ref'
        type: boolean
        required: false
        default: false
      codex_rc_version:
        description: 'Release-candidate Codex CLI version to check as well (a plain semver, for example 0.160.0); empty checks the minimum and pinned only'
        type: string
        required: false
        default: ''
      claude_rc_version:
        description: 'Claude Code version to check, on the app floor and on this one (a plain semver, for example 2.1.329); empty skips the Claude Code legs'
        type: string
        required: false
        default: ''
      conformance_prove_red:
        description: 'Run every real-CLI conformance check against a deliberately wrong expectation: the job must go red, each check named'
        type: boolean
        required: false
        default: false
      probe_p19:
        description: 'Run probe P19 (ADR-030) on Windows, macOS and Linux: does a resize make Claude Code and Codex redraw their screen after a re-attach that starts mid-stream; the recordings are uploaded'
        type: boolean
        required: false
        default: false
      probe_p21:
        description: 'Run probe P21 (ADR-030) on the Windows runner: does the helper''s capture mode capture each display from the runner''s own session; the readings are uploaded'
        type: boolean
        required: false
        default: false
      snap_e2e:
        description: 'Run the Snap end-to-end check (snap-e2e) on the Windows runner: the built app, its Snap button and the helper''s capture mode on the runner''s own desktop, plus one capture from a basic-user token, then the Account usage page''s layout check in the same built app; the readings are uploaded'
        type: boolean
        required: false
        default: false
      snap_e2e_paste:
        description: 'With snap_e2e: also run the clipboard image paste''s part of the Snap spec (ADR-032): probe runs probes PW1 and PW2, gate runs C2 on the path route and the clipboard route and C4 under the load grader; empty runs neither'
        type: string
        required: false
        default: ''
      paste_e2e:
        description: 'Run the clipboard image paste end-to-end check (paste-e2e, ADR-032) on the macOS and Ubuntu runners: probe runs probes PM1 and PM2 (macOS) and PL1 (Linux), readings runs the app''s own route into Claude Code and Codex; empty runs neither'
        type: string
        required: false
        default: ''
      remote_helper_e2e:
        description: 'Run the remote helper device check (remote-helper-e2e) on the Linux runner: a localhost sshd, the static helper and the fake CLI built here, and the app''s remote-helper code adding the machine, holding a session, carrying its status line, hook events and tool calls, re-attaching and removing it; the readings and the two programs are uploaded'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A newer run supersedes the older one (ADR-028, rule 6), where that is safe:
#   - The code events of one PR share a group that cancels: opened,
#     synchronize, reopened, `ci-run` being added (which asks for the tests),
#     and the base branch being changed (which changes the merge under test).
#     A push to the PR stops the run on the commit it replaced.
#   - Every other label change, and every other edit (a title, a description),
#     runs in a second group per PR, so it can never cancel the tests of the
#     same PR. Those runs only re-decide the label and base checks (see the
#     `test` job's condition).
#   - A push (main is the only branch that pushes here) and a dispatch get a
#     group of their own per run: never cancelled, never queued behind another.
#   - So does a PR run that is started again by hand ("Re-run all jobs",
#     `run_attempt` above 1). GitHub evaluates the group of a re-run from the
#     event the run began with, so an old run of a PR would otherwise join that
#     PR's code group and cancel the matrix running on its newest commit. The
#     cost, accepted: a later push does not cancel a re-run in progress.
# release.yml has no concurrency at all: a release is never cancelled.
# tests/unit/scripts/ci-cadence.test.ts evaluates these two expressions against
# each event.
concurrency:
  group: >-
    ${{
      (github.event_name != 'pull_request' || github.run_attempt != 1) && format('ci-run-{0}', github.run_id)
      || (github.event.action == 'labeled' && github.event.label.name != 'ci-run'
          || github.event.action == 'unlabeled'
          || github.event.action == 'edited' && github.event.changes.base.ref.from == '')
         && format('ci-pr-{0}-labels', github.event.pull_request.number)
      || format('ci-pr-{0}', github.event.pull_request.number)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, always-on guard (not gated on the `ci-run` label): CHANGELOG.md is
  # generated from src/renderer/changelog.ts, so it must never drift. The
  # generator is zero-dependency, so no npm install is needed.
  changelog:
    name: Changelog in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify CHANGELOG.md matches changelog.ts
        run: node scripts/gen-changelog.js --check

  # Desktop test gate (#309; ADR-028, rule 9). Headless CI can pass while the
  # packaged app fails to run usefully on a real desktop (it has), so "was the
  # built app actually exercised?" is a real acceptance gate. The owner set its
  # level on 2026-11-14: desktop testing is at RELEASE level on beta and
  # PRE-RELEASE on stable, not per PR.
  #   - A PR into `beta` or a `release/*` line needs no label: this check
  #     reports success and says so. The owner desktop-tests the RELEASED beta
  #     build, and that test is an input to the stable promotion.
  #   - A PR into `main` (the stable promotion, release/vX.Y.Z -> main) must
  #     carry one of the labels, as every PR did before:
  #       `desktop-tested`    a HUMAN opened and exercised the packaged app
  #       `runtime-validated` AUTOMATED runtime validation passed (VM Playwright e2e)
  #       `skip-desktop-test` nothing to exercise (docs/deps/CI/changelog-only)
  # Direct pushes to `main` have no PR and are exempt by the event guard.
  #
  # The job's only `if` is event-scoped (`pull_request`), and that is the whole
  # design: on every PR event it ALWAYS runs, then decides INSIDE, in
  # scripts/ci/desktop-gate.mjs. Never turn the base branch or the labels into
  # a job-level or step-level `if:`: a job skipped by its condition reports as
  # passed, so a skip would wave a PR into main through.
  #
  # The script reads the pull request AS IT IS NOW from GitHub (its base branch
  # and its labels). The event gives it the PR's number and nothing else, on
  # purpose: a run started again by hand replays the event it began with, so a
  # run that began on a `beta` base, or while `desktop-tested` was on the PR,
  # would otherwise report green again after the PR was retargeted to `main`
  # or lost the label. A pull request that cannot be read decides nothing: the
  # check fails and says to re-run it.
  #
  # The decision is redone whenever its inputs change: `labeled` / `unlabeled`
  # for the labels, `edited` for the base branch, so a PR cannot pass on a
  # `beta` base and keep that green after being retargeted to `main`.
  #
  # The job only reads: the checkout (for the script) and the pull request.
  # Keep the name exactly `Desktop test gate`: checks are known by name.
  desktop-gate:
    name: Desktop test gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide from the PR as it is now - a label is asked only on a PR into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/desktop-gate.mjs

  test:
    # Gate the test matrix on a `ci-run` label for PRs.
    # Rationale: this repo accumulates many WIP commits per PR (multi-phase v1.x
    # branches sit open for weeks while P0..PN land). Running the full Win/macOS
    # matrix on every push wastes minutes and creates red-X noise on intermediate
    # commits. Apply the `ci-run` label when the PR is ready for a real CI gate
    # (e.g. before requesting human review, before merge, or after a fix-loop).
    # Direct pushes to `main` always run CI as the final pre-merge guard.
    #
    # A label change does not restart the tests (ADR-028, rule 6): on a
    # `labeled` event the matrix runs only when the label added is `ci-run`
    # itself, and on an `unlabeled` event never. Nor does an edit of the PR's
    # title or description: on an `edited` event the matrix runs only when the
    # base branch changed, because the merge under test is then another one.
    # The results already reported for the commit stand. (The cheap always-on
    # jobs, `changelog` and `ssh-smoke`, do run again on a label change or an
    # edit, about a minute in all: a job skipped by its condition reports as
    # passed under its own name, which would sit over an earlier red result
    # for the same commit.)
    #
    # `Test (windows-2025)` and `Test (macos-latest)` are REQUIRED checks in
    # the branch rulesets. Never gate this job (or the Windows jobs below) on
    # the changed paths, here or with a workflow-level path filter: a job
    # skipped as a whole never reports those names and the PR waits forever.
    # The paths are read INSIDE the job ("Decide the scope" below), which then
    # ends green.
    #
    # Windows is not in this matrix. Its suite took about 24 minutes in one job
    # and set every PR's CI time, so it runs in parts, side by side, in the
    # three jobs after this one, and the job among them named
    # `Test (windows-2025)` reports the required check for all of them.
    if: |
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux joined the matrix with P4.8 (OD20 D5) and was non-blocking until
    # its first green run (CI run 37134624406, recorded in
    # docs/wp1/evidence/ci-matrix.md). It blocks now: a Linux failure fails
    # the run like any other (PR 4 package gate 7 needs Windows, macOS and
    # Linux green).
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest takes the native rebuild path below, as macOS does.
        os: [macos-latest, ubuntu-latest]

    steps:
      # Depth 2: on a PR this is the merge commit and its parents, so the next
      # step can read what the PR changes against its base. No git operation
      # in this job needs the token (the scope reads local git, and the WP1
      # ledger fetch reads the public origin), so it is not left on disk while
      # the PR's own code runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # CI runs only what a change touches (ADR-028, rule 6), the safe minimum:
      # a PR that changes ONLY documentation (Markdown, docs/, CONTEXT.d/,
      # architecture/) skips the suite on macOS here (and on Windows, in the
      # jobs below). Linux always runs it, because some tests read the Markdown
      # they guard. The job itself still runs and ends green, so the required
      # checks report.
      #
      # EVERY step below carries `steps.scope.outputs.suite != 'false'`: only
      # the literal 'false' skips, so an output that was never written runs the
      # suite (scripts/ci/change-scope.mjs; the test file named above checks
      # each step). A new step needs the same condition.
      - name: Decide the scope
        id: scope
        run: node scripts/ci/change-scope.mjs

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.suite != 'false'
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.suite != 'false'
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        if: steps.scope.outputs.suite != 'false'
        run: pip install setuptools

      - name: Install dependencies
        if: steps.scope.outputs.suite != 'false'
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        if: steps.scope.outputs.suite != 'false'
        run: node node_modules/electron/install.js

      # macOS and Linux rebuild node-pty and better-sqlite3 from source. Windows
      # never does (why: the comment above test-windows-part). It is not in this
      # matrix; the `runner.os != 'Windows'` guard is kept on purpose, so the
      # step stays right if Windows ever rejoins it.
      - name: Rebuild native modules
        if: steps.scope.outputs.suite != 'false' && runner.os != 'Windows'
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Typecheck
        if: steps.scope.outputs.suite != 'false'
        run: npm run typecheck

      # A WP1 gate test lists the tree of the commit its ledger is bound to, and
      # the checkout above is shallow: fetch exactly that one commit. Shared with
      # release.yml's test steps (see the script's header).
      - name: Fetch the WP1 ledger's bound commit
        if: steps.scope.outputs.suite != 'false'
        run: node scripts/wp1/fetch-ledger-commit.mjs

      - name: Unit tests
        if: steps.scope.outputs.suite != 'false'
        run: npx vitest run

      - name: Unit tests (native / SQLite under Electron-as-Node)
        if: steps.scope.outputs.suite != 'false'
        run: npm run test:unit:native

      - name: Build
        if: steps.scope.outputs.suite != 'false'
        run: npm run build

      # Beta-testing artifact pipeline.
      # When a PR's source branch starts with `release/` we also produce
      # platform installers and upload them as workflow artifacts so the
      # PR's Actions run page becomes the download point for each iteration
      # of a release candidate. Signing/notarisation are skipped here —
      # CI lacks the Apple Developer ID secrets the formal release workflow
      # uses, so the macOS DMG is unsigned and Gatekeeper will warn on
      # first launch (right-click → Open). The Windows installer is made the
      # same way in `release-windows-installer` below, unsigned, with the same
      # SmartScreen warning as the release pipeline.
      # Gate on runner.os, NOT a matrix image name: `matrix.os` carries whatever
      # image is pinned above, so a re-pin silently turns these steps off while
      # the job stays green.
      #
      # The installer carries the session helper (plan 2.1.3-beta.6 section B),
      # built here as release.yml builds it, and the packaged copy is checked:
      # a test installer without it would not be the one users get.
      - name: Build the session helper (release/* branches only)
        if: steps.scope.outputs.suite != 'false' && runner.os == 'macOS' && startsWith(github.head_ref, 'release/')
        shell: bash
        working-directory: helper
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: '0'
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked

      - name: Package macOS DMG (release/* branches only)
        if: steps.scope.outputs.suite != 'false' && runner.os == 'macOS' && startsWith(github.head_ref, 'release/')
        run: npx electron-builder --mac

      - name: Verify the session helper is packaged (release/* branches only)
        if: steps.scope.outputs.suite != 'false' && runner.os == 'macOS' && startsWith(github.head_ref, 'release/')
        run: npm run verify:helper

      - name: Upload macOS DMG
        if: steps.scope.outputs.suite != 'false' && runner.os == 'macOS' && startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # The record a beta release reads to reuse this run instead of running the
      # suite again (ADR-028, rule 4; scripts/ci/reuse-green-ci.mjs): the LAST
      # step of the job is named after the git tree the job checked out, and it
      # is reached only when every step above passed. On a PR that tree is the
      # merge of the branch into its base, so a branch behind its base records
      # the tree it really tested, not the tree of its own head. Keep these two
      # steps last, and never give them always() or continue-on-error.
      - name: Read the tree under test
        id: tree
        if: steps.scope.outputs.suite != 'false'
        shell: bash
        run: echo "sha=$(git rev-parse --verify 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Tested tree ${{ steps.tree.outputs.sha }}
        if: steps.scope.outputs.suite != 'false'
        shell: bash
        run: echo "The suite, the native tests and the build passed on this tree."

  # Windows, in parts (2.1.3-beta.6). In one job the Windows suite took a
  # median of 24 minutes (26 for the job, five runs on 2026-11-15 and 16) and
  # set the CI time of every PR. The two jobs below run side by side, and a third,
  # `test-windows`, named `Test (windows-2025)`, waits for them and reports the
  # required check:
  #   - test-windows-part: the unit suite in four parts (vitest --shard); the
  #     four together are the whole suite, each file in one part. The few files
  #     that start many Windows PowerShell processes are spread across the
  #     parts by weight, and every other file goes where vitest's own hash
  #     split puts it (vitest.config.ts, scripts/ci/shard-by-weight.mjs). The
  #     count is the size of the matrix (strategy.job-total): add a part there
  #     to raise it. Each part's summary lists its slowest files, which is
  #     where a weight that has drifted shows.
  #   - test-windows-build: the typecheck, the native tests and the build. On
  #     a release/* branch the installer is made once, by
  #     `release-windows-installer` (below), which this check never waits for.
  # Each decides the scope itself ("Decide the scope"), as the Test jobs do,
  # and starts on the same events. None of their names begins with `Test (`,
  # so the release gate and the green-run reuse (TEST_JOB_RE) read only
  # `Test (windows-2025)`, which stands for them. Both are matrix jobs (the
  # build a matrix of one, `os` naming it only) so that, skipped as a whole on
  # a label change or an edit, they report their names unexpanded and the
  # results already in the PR's list stand.
  #
  # Each job has a timeout: a part takes under 10 minutes and the build about
  # 2, so 30 minutes (10 for the check, which takes seconds) stops a hung job
  # long before GitHub's default of six hours. A part that times out fails
  # the check.
  #
  # windows-2025 pinned (not -latest): the windows-2025-vs2026 image that
  # windows-latest now redirects to ships ONLY Visual Studio 2026 ("18"), which
  # @electron/node-gyp cannot use yet -> better-sqlite3 rebuild fails. Unpin
  # once the electron toolchain supports VS 2026.
  #
  # No native rebuild on Windows, and so no VS Build Tools and no Python.
  # node-pty and better-sqlite3 ship N-API prebuilt binaries
  # (prebuilds/win32-x64) that load unchanged under Electron (verified:
  # test:unit:native loads SQLite under electron-as-node from the prebuild),
  # so they are used as-is: `npm ci --ignore-scripts` builds nothing, and the
  # installer is packaged with `--config.npmRebuild=false`. This drops a
  # dependency on community.chocolatey.org, whose per-IP rate limiting (behind
  # Cloudflare) intermittently blocks GitHub's SHARED runner IPs and failed the
  # VS Build Tools install at random with "not valid XML". macOS and Linux
  # still rebuild from source, in the test job.
  #
  # No git operation in these jobs needs the token (the scope reads local git,
  # and the WP1 ledger fetch reads the public origin), so the checkouts do not
  # leave it on disk while the PR's own code runs.
  test-windows-part:
    if: |
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    name: Test part ${{ matrix.part }} of ${{ strategy.job-total }} (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      suite: ${{ steps.scope.outputs.suite }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # Every step below carries `steps.scope.outputs.suite != 'false'`, as in
      # the test job (only the literal 'false' skips).
      - name: Decide the scope
        id: scope
        run: node scripts/ci/change-scope.mjs

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.suite != 'false'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.suite != 'false'
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        if: steps.scope.outputs.suite != 'false'
        run: node node_modules/electron/install.js

      - name: Fetch the WP1 ledger's bound commit
        if: steps.scope.outputs.suite != 'false'
        run: node scripts/wp1/fetch-ledger-commit.mjs

      # The makensis probes (tests/unit/main/installer-nsis-behaviour.test.ts)
      # compile the real installer macros and run them, and skip without a
      # compiler. electron-builder's own, fetched as a release build fetches
      # it, into MAKENSIS for the suite; the file's tripwire fails a Windows
      # CI run that has none.
      - name: Fetch the NSIS compiler for the installer probes
        if: steps.scope.outputs.suite != 'false'
        run: node scripts/ci/fetch-makensis.mjs

      # The reporters are vitest's two defaults on GitHub Actions (naming them
      # replaces the defaults) and its own JSON report, for the next step.
      - name: Unit tests
        if: steps.scope.outputs.suite != 'false'
        run: npx vitest run --shard=${{ matrix.part }}/${{ strategy.job-total }} --reporter=default --reporter=github-actions --reporter=json --outputFile.json=${{ runner.temp }}/vitest-part.json

      - name: Slowest test files in this part
        if: ${{ !cancelled() && steps.scope.outputs.suite != 'false' }}
        run: node scripts/ci/slow-test-files.mjs "${{ runner.temp }}/vitest-part.json" 15 "part ${{ matrix.part }} of ${{ strategy.job-total }}"

  test-windows-build:
    if: |
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    name: Build and native tests (${{ matrix.os }})
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      suite: ${{ steps.scope.outputs.suite }}
    strategy:
      matrix:
        os: [windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # Every step below carries `steps.scope.outputs.suite != 'false'`, as in
      # the test job (only the literal 'false' skips). No Python: nothing here
      # compiles native code (see above test-windows-part).
      - name: Decide the scope
        id: scope
        run: node scripts/ci/change-scope.mjs

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.suite != 'false'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.suite != 'false'
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        if: steps.scope.outputs.suite != 'false'
        run: node node_modules/electron/install.js

      - name: Typecheck
        if: steps.scope.outputs.suite != 'false'
        run: npm run typecheck

      - name: Unit tests (native / SQLite under Electron-as-Node)
        if: steps.scope.outputs.suite != 'false'
        run: npm run test:unit:native

      - name: Build
        if: steps.scope.outputs.suite != 'false'
        run: npm run build

  # The Windows half of the beta-testing artifact pipeline (see the macOS half
  # in the test job), in two jobs of their own from 2.1.3-beta.17: on a pull
  # request from a release/* branch, the installer is packaged, checked and
  # uploaded by `release-windows-installer` only. The installer carries the
  # session helper, built and checked as in the macOS half, and the static
  # Linux helpers with their manifest (remote step 1), which only Linux runners
  # build: `release-helper-linux` builds the x86-64 one with the Helper job's
  # steps word for word, `release-helper-linux-arm64` (from 2.1.3-beta.19) the
  # arm64 one on GitHub's arm64 runner with the arm64 Helper job's steps word
  # for word, and the packaging job needs both. So neither the Build and native
  # tests job nor `Test (windows-2025)` ever waits for a Linux build; none of
  # these jobs is a required check, no job needs the packaging job, and on a
  # red run the installer can still be uploaded (`Test (windows-2025)` is what
  # says whether the tree passed).
  #
  # All three have the same condition: the Test jobs' pull-request rule, for a
  # release/* source branch only (a push has no source branch). None reads
  # the change scope (scripts/ci/change-scope.mjs): a documentation-only
  # release/* pull request packages the Windows installer too, where the macOS
  # half in the test job is skipped with the suite. The artifacts are named
  # apart from the Helper jobs' helper-linux-musl and helper-linux-musl-arm64,
  # which the same run may upload too
  # (tests/unit/scripts/helper-release-job.test.ts).
  release-helper-linux:
    name: Static Linux helper (release/* test installer)
    if: |
      startsWith(github.head_ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'ci-run') &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build the glibc debug helper the static check compares against
        shell: bash
        working-directory: helper
        run: cargo build --locked --bin aicc-helper

      - name: Build the static Linux helper
        shell: bash
        working-directory: helper
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin aicc-helper
          mkdir -p target/helper-linux-musl
          cp target/x86_64-unknown-linux-musl/release/aicc-helper target/helper-linux-musl/

      - name: Check the Linux helper is static
        shell: bash
        working-directory: helper
        run: |
          # 0 static, 1 not static, 2 not an x86-64 ELF file or not read.
          is_static() {
            local hdr segs dyn
            hdr=$(readelf --file-header --wide "$1") || return 2
            grep -q 'Class:[[:space:]]*ELF64' <<<"$hdr" || return 2
            grep -q 'Machine:[[:space:]]*Advanced Micro Devices X86-64' <<<"$hdr" || return 2
            segs=$(readelf --program-headers --wide "$1") || return 2
            dyn=$(readelf --dynamic --wide "$1") || return 2
            grep -q 'INTERP' <<<"$segs" && return 1
            grep -q '(NEEDED)' <<<"$dyn" && return 1
            return 0
          }
          built=target/helper-linux-musl/aicc-helper
          rc=0; is_static "$built" || rc=$?
          file "$built"
          echo "Static Linux helper: $(file -b "$built"), $(stat -c %s "$built") bytes." >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::error::$built is not a static x86-64 ELF program (check status $rc)"
            exit 1
          fi
          rc=0; is_static target/debug/aicc-helper || rc=$?
          if [ "$rc" != 1 ]; then
            echo "::error::the check did not find the glibc debug build dynamic (check status $rc), so it proves nothing"
            exit 1
          fi
          echo "static: $built; the check finds the glibc debug build dynamic, as it must"

      - name: Upload the static Linux helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helper-linux-musl-installer
          path: helper/target/helper-linux-musl
          if-no-files-found: error
          retention-days: 14

  # The arm64 static Linux helper for the release/* test installer (2.1.3-beta.19,
  # section 1.3): the arm64 Helper job's four steps word for word, on the same
  # arm64 runner, after the glibc debug build its static check compares against.
  release-helper-linux-arm64:
    name: Static arm64 Linux helper (release/* test installer)
    if: |
      startsWith(github.head_ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'ci-run') &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build the glibc debug helper the static check compares against
        shell: bash
        working-directory: helper
        run: cargo build --locked --bin aicc-helper

      - name: Build the static arm64 Linux helper
        shell: bash
        working-directory: helper
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --locked --release --target aarch64-unknown-linux-musl --bin aicc-helper
          mkdir -p target/helper-linux-musl-arm64
          cp target/aarch64-unknown-linux-musl/release/aicc-helper target/helper-linux-musl-arm64/

      - name: Check the arm64 Linux helper is static
        shell: bash
        working-directory: helper
        run: |
          # 0 static, 1 not static, 2 not an AArch64 ELF file or not read.
          is_static() {
            local hdr segs dyn
            hdr=$(readelf --file-header --wide "$1") || return 2
            grep -q 'Class:[[:space:]]*ELF64' <<<"$hdr" || return 2
            grep -q 'Machine:[[:space:]]*AArch64' <<<"$hdr" || return 2
            segs=$(readelf --program-headers --wide "$1") || return 2
            dyn=$(readelf --dynamic --wide "$1") || return 2
            grep -q 'INTERP' <<<"$segs" && return 1
            grep -q '(NEEDED)' <<<"$dyn" && return 1
            return 0
          }
          built=target/helper-linux-musl-arm64/aicc-helper
          rc=0; is_static "$built" || rc=$?
          file "$built"
          echo "Static arm64 Linux helper: $(file -b "$built"), $(stat -c %s "$built") bytes." >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::error::$built is not a static AArch64 ELF program (check status $rc)"
            exit 1
          fi
          rc=0; is_static target/debug/aicc-helper || rc=$?
          if [ "$rc" != 1 ]; then
            echo "::error::the check did not find the glibc debug build dynamic (check status $rc), so it proves nothing"
            exit 1
          fi
          echo "static: $built; the check finds the glibc debug build dynamic, as it must"

      - name: Run the arm64 Linux helper once
        shell: bash
        working-directory: helper
        run: |
          want="aicc-helper $(awk -F'"' '/^\[/ { p = ($0 == "[package]") } p && /^version = / { print $2; exit }' Cargo.toml)"
          said=$(target/helper-linux-musl-arm64/aicc-helper version)
          echo "The arm64 Linux helper ran here: $said" >> "$GITHUB_STEP_SUMMARY"
          if [ "$said" != "$want" ]; then
            echo "::error::target/helper-linux-musl-arm64/aicc-helper version says \"$said\", not \"$want\""
            exit 1
          fi
          echo "ran: $said"

      - name: Upload the static arm64 Linux helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helper-linux-musl-arm64-installer
          path: helper/target/helper-linux-musl-arm64
          if-no-files-found: error
          retention-days: 14

  release-windows-installer:
    name: Windows test installer (release/* branches)
    needs: [release-helper-linux, release-helper-linux-arm64]
    if: |
      startsWith(github.head_ref, 'release/') &&
      contains(github.event.pull_request.labels.*.name, 'ci-run') &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build

      - name: Build the session helper (release/* branches only)
        shell: bash
        working-directory: helper
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: '0'
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked

      # Check the helper carries its own C runtime, as the Helper job and release.yml do (helper/.cargo/config.toml, scripts/check-pe-imports.mjs).
      - name: Check the session helper carries its own C runtime (release/* branches only)
        run: node scripts/check-pe-imports.mjs helper/target/release/aicc-helper.exe

      # The static Linux helpers from the two jobs above, and the manifest of
      # their hashes, written before packaging, as release.yml's build-windows
      # does (scripts/write-helper-manifest.mjs).
      - name: Download the static Linux helper
        uses: actions/download-artifact@v8
        with:
          name: helper-linux-musl-installer
          path: helper/target/helper-linux-musl

      - name: Download the static arm64 Linux helper
        uses: actions/download-artifact@v8
        with:
          name: helper-linux-musl-arm64-installer
          path: helper/target/helper-linux-musl-arm64

      - name: Write the session helper manifest
        run: node scripts/write-helper-manifest.mjs

      - name: Package Windows installer (release/* branches only)
        # --config.npmRebuild=false: Windows uses the prebuilds as-is (see above
        # test-windows-part), so electron-builder must not rebuild them either.
        run: npx electron-builder --win --config.npmRebuild=false

      - name: Verify native modules unpacked (release/* branches only)
        run: npm run verify:package

      - name: Verify the session helper is packaged (release/* branches only)
        run: npm run verify:helper

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  # The required check `Test (windows-2025)`, for the Windows suite jobs above
  # (`test-windows-part` and `test-windows-build`, not the release/* installer
  # jobs). It needs both of them and starts whatever they ended with (`always()`:
  # without it, a part that failed would leave this job skipped, and a skipped
  # job reports as passed). scripts/ci/all-parts-passed.mjs then passes only
  # when each of them passed: a part that failed, was cancelled, timed out or
  # was skipped fails it. That includes a run cancelled as a whole (a newer
  # push or run replaced it, or someone cancelled it): this job still starts
  # and fails, so a Windows run that did not finish never reads as passed. It
  # is not `!cancelled()`, which does not start it in a cancelled run and can
  # leave the check skipped. The red check left on a commit that a newer push
  # replaced is harmless, as the old Windows matrix job's cancelled check was.
  # Its event rule is otherwise the Test jobs', so on a label change or an
  # edit it is skipped with them and the results already reported for the
  # commit stand.
  #
  # It is a matrix of one, named from `matrix.os` as the `test` job is, for
  # that skip: a job skipped by its condition reports its name unexpanded, and
  # GitHub counts a skipped check as passed. With a plain name, a label change
  # would report a skipped `Test (windows-2025)` over a red one. `os` only
  # names the check; the job runs on Linux (below).
  #
  # It ends, as the Test jobs do, with the step named after the tree under
  # test, which a beta release reads to reuse this run (ADR-028, rule 4;
  # scripts/ci/reuse-green-ci.mjs). Every job of a run checks out the same
  # commit, so that is the tree the parts tested; on a documentation-only
  # change, when every part skipped the suite, the step is skipped too. Keep
  # these two steps last, and never give them always() or continue-on-error.
  # Nothing in this job is Windows, so it runs on a Linux runner, which starts
  # in seconds. It only reads.
  test-windows:
    needs: [test-windows-part, test-windows-build]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
        github.event.action != 'unlabeled' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
        (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-2025]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Every Windows part passed
        id: parts
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECT: test-windows-part test-windows-build
        run: node scripts/ci/all-parts-passed.mjs

      - name: Read the tree under test
        id: tree
        if: steps.parts.outputs.suite != 'false'
        shell: bash
        run: echo "sha=$(git rev-parse --verify 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Tested tree ${{ steps.tree.outputs.sha }}
        if: steps.parts.outputs.suite != 'false'
        shell: bash
        run: echo "Every Windows part of the suite, the native tests and the build passed on this tree."

  # Real-CLI conformance (P4.8; rows 59, 60; OD20 D7, WP1.71). Each supported
  # Codex CLI version is installed into a prefix of its own on each OS and run
  # with no sign-in, each run in a fresh, empty Codex home: the app's discovery
  # (row 2's detection evidence per OS), the help of every command line the
  # app runs, the model list read and offered by the Codex picker as read
  # (aicc_planning#362), the feature list, and the
  # flag-drift suite. P3.1's help captures are made again, uploaded, and
  # asserted against the normalised fixtures as each OS reads them: the
  # captures of each OS were reviewed (CI run 37134624406) and only the
  # differences reviewed are accepted (CCC_CODEX_HELP_ASSERT). See
  # tests/integration/codex-real-cli-conformance.test.ts and
  # docs/wp1/evidence/ci-matrix.md.
  #
  # PR and push runs check the minimum and the pinned version, both read from
  # src/main/providers/codex/cli-contract.ts. The release candidate is a
  # dispatch input (PR runs have none), checked at release level. The job
  # holds no secrets and installs only the published @openai/codex package.
  # Gated like the test matrix: the `ci-run` label on a PR, every push to main,
  # and not restarted by another label change or an edit (see the `test` job).
  codex-conformance:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    name: Codex CLI ${{ matrix.cli }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
        cli: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.codex_rc_version != '' && '["minimum","pinned","rc"]' || '["minimum","pinned"]') }}
    env:
      CCC_CODEX_CONFORMANCE_KIND: ${{ matrix.cli }}
      CCC_CODEX_CONFORMANCE_PROVE_RED: ${{ inputs.conformance_prove_red && '1' || '0' }}
      # '1' since the help captures of each OS were reviewed (P4.10; the
      # differences accepted are in tests/integration/codex-conformance-lib.ts).
      CCC_CODEX_HELP_ASSERT: '1'
    steps:
      # No git operation in this job needs the token, so it is not left on
      # disk for the third-party install below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v7
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        if: runner.os != 'Windows'
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The suite imports the Codex package, whose module graph loads node-pty;
      # as in the test job, Windows uses the shipped prebuilds and macOS and
      # Linux rebuild it. No Electron binary is needed: vitest mocks electron.
      - name: Rebuild native modules
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Resolve this run's Codex version
        id: ver
        env:
          RC_VERSION: ${{ inputs.codex_rc_version }}
        run: node tests/integration/codex-conformance-ci.mjs version ${{ matrix.cli }}

      # Codex prepares its home before it parses even --version, so every run
      # of the CLI in this job gets a fresh, empty CODEX_HOME: the suite makes
      # one per run, these steps make the PATH check's and the flag-drift
      # suite's, and the last step proves the runner's own home untouched.
      - name: The runner's own Codex home, before
        run: node tests/integration/codex-conformance-ci.mjs own-home record "${{ runner.temp }}/own-codex-home.txt"

      # The package and its platform packages declare no install scripts
      # (0.153.4, 0.155.1), so none runs; the tarballs go to a cache of their
      # own, not the npm cache the job saves under the lockfile's key.
      - name: Install Codex ${{ steps.ver.outputs.version }} into its own prefix
        shell: bash
        env:
          CODEX_VERSION: ${{ steps.ver.outputs.version }}
          PREFIX: ${{ runner.temp }}/codex-${{ matrix.cli }}
          NPM_CACHE: ${{ runner.temp }}/npm-codex-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "@openai/codex@$CODEX_VERSION"

      - name: Locate the installed CLI
        id: bin
        run: node tests/integration/codex-conformance-ci.mjs bin "${{ runner.temp }}/codex-${{ matrix.cli }}"

      - name: Fresh Codex homes for the PATH check and the flag-drift suite
        id: homes
        run: node tests/integration/codex-conformance-ci.mjs homes onpath compat

      # Prove the install is the one PATH finds before the flag-drift suite
      # runs against it. On this job that suite fails, never skips, when it
      # finds no codex on PATH (CCC_CODEX_CONFORMANCE_KIND is set).
      - name: The installed CLI is the one on PATH
        shell: bash
        env:
          CODEX_VERSION: ${{ steps.ver.outputs.version }}
          CODEX_HOME: ${{ steps.homes.outputs.onpath }}
        run: |
          out="$(codex --version | tr -d '\r')"
          echo "$out"
          [ "$out" = "codex-cli $CODEX_VERSION" ] || { echo "::error::codex on PATH printed '$out', not codex-cli $CODEX_VERSION"; exit 1; }

      - name: Real-CLI conformance (the app's discovery, runner and readers)
        env:
          CCC_CODEX_CONFORMANCE_BIN: ${{ steps.bin.outputs.bin }}
          CCC_CODEX_CONFORMANCE_VERSION: ${{ steps.ver.outputs.version }}
          CCC_CODEX_CONFORMANCE_OUT: ${{ runner.temp }}/codex-conformance
        run: npx vitest run tests/integration/codex-real-cli-conformance.test.ts

      - name: Flag-drift suite against this install
        env:
          CODEX_HOME: ${{ steps.homes.outputs.compat }}
        run: npx vitest run tests/integration/codex-cli-compat.test.ts

      - name: No run of the CLI touched the runner's own Codex home
        if: ${{ !cancelled() }}
        run: node tests/integration/codex-conformance-ci.mjs own-home check "${{ runner.temp }}/own-codex-home.txt"

      - name: Upload the help captures and the run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-conformance-${{ matrix.os }}-${{ matrix.cli }}
          path: ${{ runner.temp }}/codex-conformance
          if-no-files-found: warn
          retention-days: 30

  # Probe P19 (ADR-030; plan 2.1.3-beta.11, section A1): after a re-attach that
  # starts mid-stream, does a resize make Claude Code and Codex redraw their
  # screen? helper/probes/p19-record.cjs runs each CLI on a terminal of its own
  # in a fresh environment, pointed at a stand-in model on a loopback port (no
  # account, no key, no secret), and records every chunk; helper/probes/README.md
  # says how it measures. The Windows test machine gives the main Windows
  # reading; windows-2025 here is a second one, macOS and Linux the only ones.
  #
  # It runs ONLY on a dispatch that names it (`probe_p19`), never on a pull
  # request or a push, and is not a required check. Built like the Codex
  # conformance job above: npm ci with scripts off, the native rebuild off
  # Windows, each CLI's published package into a prefix and a cache of its own
  # with scripts off (Claude Code's own install script copies its native program
  # into place; the probe runs that program from its platform package instead),
  # read-only, and the recordings and the result uploaded as probe-p19-<os>.
  # tests/unit/scripts/probe-p19-job.test.ts evaluates its condition.
  probe-p19:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_p19 == true
    name: Probe P19 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
    env:
      # The versions the Windows test machine has (ADR-030, P18 and P19); for
      # Codex, the dispatch's codex_rc_version instead when it gives one (P19's
      # second run, 0.170.0). It reaches npm through env, never a shell line.
      P19_CLAUDE_VERSION: '2.1.328'
      P19_CODEX_VERSION: ${{ inputs.codex_rc_version != '' && inputs.codex_rc_version || '0.157.1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Claude Code's package asks for node 22 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v7
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        if: runner.os != 'Windows'
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild node-pty
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Install Claude Code ${{ env.P19_CLAUDE_VERSION }} into its own prefix
        shell: bash
        env:
          PREFIX: ${{ runner.temp }}/p19-claude
          NPM_CACHE: ${{ runner.temp }}/npm-p19-claude-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "@anthropic-ai/claude-code@$P19_CLAUDE_VERSION"

      - name: Install Codex ${{ env.P19_CODEX_VERSION }} into its own prefix
        shell: bash
        env:
          PREFIX: ${{ runner.temp }}/p19-codex
          NPM_CACHE: ${{ runner.temp }}/npm-p19-codex-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "@openai/codex@$P19_CODEX_VERSION"

      - name: Locate the two native programs
        id: bin
        run: node helper/probes/p19-record.cjs locate "${{ runner.temp }}/p19-claude" "${{ runner.temp }}/p19-codex"

      - name: Run probe P19
        shell: bash
        env:
          P19_CLAUDE: ${{ steps.bin.outputs.claude }}
          P19_CODEX: ${{ steps.bin.outputs.codex }}
          P19_OUT: ${{ runner.temp }}/probe-p19
        run: node helper/probes/p19-record.cjs run --root . --out "$P19_OUT" --claude "$P19_CLAUDE" --codex "$P19_CODEX" --conpty both

      - name: Upload the recordings and the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-p19-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-p19
          if-no-files-found: warn
          retention-days: 30

  # Probe P21, the console half (ADR-030; plan 2.1.3-beta.15, section B5,
  # aicc_planning#391): from a session that has a desktop, does the helper's
  # capture mode write each display's picture, at its size and scale, in time?
  # The Windows test machine could not measure it (nobody is signed in on its
  # console), so the GitHub Windows runner, whose session has a display, takes
  # the reading: the helper is built here (release, --locked) and its imports
  # checked as the Helper job checks them, then
  # helper/probes/p21-capture.cjs `measure --session console` runs it three times
  # and `verdict` prints the lines. The SSH half is not run here (the runner has
  # no SSH session); WINDOWS_1's reading of it stands, and `verdict` is told so
  # with --ssh-not-run. One display at the runner's own scale: "mixed scaling:
  # not measured (one display)" and "second scale: not measured" are the lines.
  #
  # It runs ONLY on a dispatch that names it (`probe_p21`), never on a pull
  # request or a push, and is not a required check. It is a measurement: it is
  # green whenever the probe ran to its end, whatever the verdict says; it is red
  # only when the probe could not run (the lines say why) or the program it built
  # fails the import check. It only reads: no
  # secret, read-only permissions, no npm package installed (the probe uses
  # node's own modules), the actions pinned by commit like the Helper job's.
  # Each run's pictures are read and deleted at once by the probe; what is uploaded as
  # probe-p21-<os> is the readings and the verdict, no picture.
  # tests/unit/scripts/probe-p21-job.test.ts evaluates its condition.
  probe-p21:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_p21 == true
    name: Probe P21 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build the helper (release)
        shell: bash
        working-directory: helper
        run: cargo build --locked --release --bin aicc-helper

      # The same import check as the Helper job's (scripts/check-pe-imports.mjs):
      # the program measured here carries its own C runtime and delay-loads the
      # window-manager DLLs the capture mode uses, as the shipped one does.
      - name: Check the helper carries its own C runtime
        run: node scripts/check-pe-imports.mjs helper/target/release/aicc-helper.exe

      # `measure` exits 0 when it ran to its end and 2 when it could not run; the
      # verdict is read from the readings after it. The lines go to the log and to
      # the job summary.
      - name: Run probe P21
        shell: bash
        env:
          P21_OUT: ${{ runner.temp }}/probe-p21
        run: |
          mkdir -p -- "$P21_OUT"
          rc=0
          verdict=''
          log=$(node helper/probes/p21-capture.cjs measure --helper helper/target/release/aicc-helper.exe --out "$P21_OUT" --label ci-console --session console) || rc=$?
          echo "$log"
          if [ "$rc" = 0 ]; then
            verdict=$(node helper/probes/p21-capture.cjs verdict --out "$P21_OUT" --console ci-console --ssh-not-run "the runner has no SSH session; WINDOWS_1's reading stands (FAILS CLEANLY, ADR-030)" --second-scale "the job does not change the runner's display scale") || rc=$?
            echo "$verdict"
          fi
          {
            echo '### Probe P21: the console reading on the runner'
            echo
            echo '```text'
            echo "$log"
            echo "$verdict"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload the readings and the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe-p21-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-p21
          if-no-files-found: warn
          retention-days: 30

  # Snap on Windows, end to end (plan 2.1.3-beta.16, section A1;
  # aicc_planning#401). The built app runs on the GitHub Windows runner's own
  # desktop (the test machine has nobody signed in, so it cannot), with the
  # helper built here and handed to the app through its test-only helper path
  # (the app runs from out/main, where the path beside a packaged app is not):
  # tests/e2e/snap-windows.spec.ts presses Snap and reads what it does. Before
  # it, one run of the helper's capture mode from a `runas /trustlevel:0x20000`
  # token (scripts/ci/snap-basic-user.mjs). On this runner that token has the
  # Administrators group for deny only but keeps a High mandatory level (run
  # 45273010875: "CAPTURES, but the token was not read as a basic user's"), so
  # a capture from a session that is not elevated is still unread here.
  #
  # Playwright runs with --retries=0 (playwright.config.ts sets one retry for
  # the VM's full run; it must not apply here), and the step after it fails the
  # job when the report shows a test that was retried or reported flaky
  # (scripts/ci/playwright-no-retry.mjs). A red run is answered by its cause,
  # never by a retry, a longer timer or a looser bound.
  #
  # It runs ONLY on a dispatch that names it (`snap_e2e`), never on a pull
  # request or a push. It is section evidence, like a test-machine line: it is
  # not one of the checks a PR waits for, not in release.yml and not read by
  # scripts/release-gate.mjs. It only reads: no secret, read-only permissions,
  # the actions pinned by commit. What is uploaded as snap-e2e-<os> is the
  # readings, Playwright's report, its pictures of the app's own windows and
  # D12's pictures of the Snap menu's box (cut from the runner's own screen).
  # tests/unit/scripts/snap-e2e-job.test.ts evaluates its condition.
  #
  # The spec's second part (plan 2.1.3-beta.18, section 7.5; aicc_planning#428)
  # opens a Codex tab in an app of its own: Codex 0.157.1, the version the
  # test machine's readings used (probe P19, beta.17 C9), installed from npm
  # into a prefix and a cache of its own with scripts off, as the Probe P19 job
  # installs it, and put first on the app's PATH, so the app finds the npm
  # shim as it finds a user's npm install. Its model is a stand-in on a
  # loopback port (probe P11's) and its config names one tool server that
  # cannot start, so Codex shows its warning count.
  #
  # The clipboard image paste (plan 2.1.3-beta.21 phase 2; ADR-032): with
  # snap_e2e_paste set, Claude Code 2.1.332 is installed as well, from its
  # platform package with scripts off into a prefix of its own (as the
  # claude-conformance job installs it), and the spec's part three runs:
  # `probe` (PW2, then PW1 for Codex and for Claude Code) or `gate` (C2 on
  # the path route, C2 on the clipboard route and C4, eight presses each under
  # the load grader). The job's timeout is set from the press count times each
  # test's bound plus the build: 45 minutes for the build and parts one and
  # two; `probe` adds PW2 (2 min) and two PW1 groups, each its start (3.5 min)
  # and its one test's bound (9 min) and close (2 min), so 70; `gate` adds
  # three groups, each its start (3.5 min), 8 presses of 70 s (9.3 min) and
  # its close (2 min), so 45 + 3 x 14.8, rounded up to 95. Never raised to
  # answer a red run.
  snap-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.snap_e2e == true
    name: Snap e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.snap_e2e_paste == 'gate' && 95 || inputs.snap_e2e_paste == 'probe' && 70 || 45 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install the pinned Rust toolchain
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build the helper (release)
        shell: bash
        working-directory: helper
        run: cargo build --locked --release --bin aicc-helper

      # The same import check as the Helper job's: the program the app runs here
      # carries its own C runtime and delay-loads the window-manager DLLs.
      - name: Check the helper carries its own C runtime
        run: node scripts/check-pe-imports.mjs helper/target/release/aicc-helper.exe

      # As the Windows test jobs install (no native rebuild on Windows: the
      # prebuilt node-pty and better-sqlite3 load under Electron as they are).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Build the app
        run: npm run build

      # The Codex the spec's Codex tab runs (see the job's comment above).
      - name: Install Codex 0.157.1 into its own prefix
        shell: bash
        env:
          CODEX_VERSION: '0.157.1'
          PREFIX: ${{ runner.temp }}/snap-codex
          NPM_CACHE: ${{ runner.temp }}/npm-snap-codex-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "@openai/codex@$CODEX_VERSION"

      # The Claude Code part three's PW1 and C4 run (see the job's comment above).
      - name: Resolve this runner's Claude Code package
        id: claudepkg
        if: ${{ inputs.snap_e2e_paste != '' }}
        run: node tests/integration/claude-conformance-ci.mjs package

      - name: Install Claude Code 2.1.332 into its own prefix
        if: ${{ inputs.snap_e2e_paste != '' }}
        shell: bash
        env:
          CLAUDE_VERSION: '2.1.332'
          CLAUDE_PACKAGE: ${{ steps.claudepkg.outputs.package }}
          PREFIX: ${{ runner.temp }}/snap-claude
          NPM_CACHE: ${{ runner.temp }}/npm-snap-claude-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "$CLAUDE_PACKAGE@$CLAUDE_VERSION"

      - name: Locate the installed Claude Code
        id: claudebin
        if: ${{ inputs.snap_e2e_paste != '' }}
        shell: bash
        env:
          CLAUDE_PACKAGE: ${{ steps.claudepkg.outputs.package }}
          PREFIX: ${{ runner.temp }}/snap-claude
        run: node tests/integration/claude-conformance-ci.mjs bin "$PREFIX" "$CLAUDE_PACKAGE"

      # A measurement: it prints what the run read and is red only when the
      # script itself could not run. "not measured" (the runner refused the
      # token) is a reading.
      - name: Capture from a basic-user token
        shell: bash
        env:
          SNAP_OUT: ${{ runner.temp }}/snap-e2e
        run: node scripts/ci/snap-basic-user.mjs --helper helper/target/release/aicc-helper.exe --out "$SNAP_OUT/basic-user"

      - name: Run the Snap end-to-end check
        shell: bash
        env:
          SNAP_E2E_OUT: ${{ runner.temp }}/snap-e2e
          SNAP_E2E_HELPER: ${{ github.workspace }}\helper\target\release\aicc-helper.exe
          SNAP_E2E_CODEX: ${{ runner.temp }}/snap-codex
          SNAP_E2E_PASTE: ${{ inputs.snap_e2e_paste }}
          SNAP_E2E_CLAUDE: ${{ steps.claudebin.outputs.dir }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/snap-e2e/playwright-report.json
        run: npx playwright test tests/e2e/snap-windows.spec.ts --retries=0 --workers=1 --reporter=list,json

      - name: Fail a run Playwright retried or reported flaky
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/snap-e2e/playwright-report.json
        run: node scripts/ci/playwright-no-retry.mjs "$REPORT"

      # nubbymong/aicc_planning#445: the Account usage page's layout (its grid's
      # columns at four page widths, measured in the built app with its real
      # stylesheet), whatever the Snap check answered. Same rules: retries off,
      # and a retried or flaky test fails the job.
      - name: Run the Account usage layout check
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/snap-e2e/account-usage-report.json
        run: npx playwright test tests/e2e/account-usage-grid.spec.ts --retries=0 --workers=1 --reporter=list,json

      - name: Fail a layout run Playwright retried or reported flaky
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/snap-e2e/account-usage-report.json
        run: node scripts/ci/playwright-no-retry.mjs "$REPORT"

      - name: Upload the readings and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snap-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/snap-e2e
            test-results
          if-no-files-found: warn
          retention-days: 30

  # The clipboard image paste on macOS and Linux app machines (plan
  # 2.1.3-beta.21 phase 3, 3.2 and 3.3; ADR-032; aicc_planning#447), on the
  # GitHub macOS and Ubuntu runners: the built app (out/main, not packaged)
  # with real Claude Code 2.1.332 and Codex 0.157.1 against probe P11's model
  # stand-in on a loopback port (tests/e2e/paste-unix.spec.ts). `probe` runs
  # probes PM1 and PM2 (macOS) and PL1 (Linux); `readings` runs the app's own
  # route into each CLI, every press asserted. The two CLIs are installed as
  # snap-e2e installs them: Codex from npm, Claude Code from its platform
  # package, each with scripts off into a prefix and a cache of its own.
  # node-pty and better-sqlite3 are rebuilt for Electron as the Test job
  # rebuilds them on these systems.
  #
  # Linux runs under Xvfb (X11; Wayland is not measured here, and is written
  # down as not measured). Claude Code reads the clipboard there by running
  # xclip or wl-paste, so the spec runs once per state of the two: neither
  # (both removed first), xclip, then wl-clipboard alone (which, under X11,
  # probe PL1 read does not serve Claude Code); each run is its own
  # Playwright run with PASTE_E2E_LINUX_TOOLS naming the state, and the next
  # state's run goes on whatever the last one answered. Electron's
  # sandbox helper is made root's and setuid, as Electron's own Linux CI does,
  # so the app starts with its sandbox on.
  #
  # Playwright runs with --retries=0, and the step after each run fails the
  # job when its report shows a test retried or reported flaky
  # (scripts/ci/playwright-no-retry.mjs). A red run is answered by its cause,
  # never by a retry, a longer timer or a looser bound. The timeout is set
  # from the presses: about 10 minutes of build and installs; macOS about 12
  # for either part; Linux, three states, each two tabs' start (4 min) and
  # its presses (about 4 min for `probe`; for `readings` 9 with xclip and
  # 3 without): 60 and 50 minutes. Never raised to answer a red run.
  #
  # It runs ONLY on a dispatch that names it (`paste_e2e`, `probe` or
  # `readings`), never on a pull request or a push. It is section evidence:
  # not one of the checks a PR waits for, not in release.yml and not read by
  # scripts/release-gate.mjs. It only reads: no secret, read-only
  # permissions, the actions pinned by commit. What is uploaded as
  # paste-e2e-<os> is the readings and Playwright's reports.
  # tests/unit/scripts/paste-e2e-job.test.ts evaluates its condition.
  paste-e2e:
    if: github.event_name == 'workflow_dispatch' && (inputs.paste_e2e == 'probe' || inputs.paste_e2e == 'readings')
    name: Paste e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.paste_e2e == 'probe' && 60 || 50 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Rebuild native modules
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Let Electron's sandbox helper run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb

      - name: Build the app
        run: npm run build

      - name: Install Codex 0.157.1 into its own prefix
        shell: bash
        env:
          CODEX_VERSION: '0.157.1'
          PREFIX: ${{ runner.temp }}/paste-codex
          NPM_CACHE: ${{ runner.temp }}/npm-paste-codex-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "@openai/codex@$CODEX_VERSION"

      - name: Resolve this runner's Claude Code package
        id: claudepkg
        run: node tests/integration/claude-conformance-ci.mjs package

      - name: Install Claude Code 2.1.332 into its own prefix
        shell: bash
        env:
          CLAUDE_VERSION: '2.1.332'
          CLAUDE_PACKAGE: ${{ steps.claudepkg.outputs.package }}
          PREFIX: ${{ runner.temp }}/paste-claude
          NPM_CACHE: ${{ runner.temp }}/npm-paste-claude-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "$CLAUDE_PACKAGE@$CLAUDE_VERSION"

      - name: Locate the installed Claude Code
        id: claudebin
        shell: bash
        env:
          CLAUDE_PACKAGE: ${{ steps.claudepkg.outputs.package }}
          PREFIX: ${{ runner.temp }}/paste-claude
        run: node tests/integration/claude-conformance-ci.mjs bin "$PREFIX" "$CLAUDE_PACKAGE"

      - name: Run the paste end-to-end check (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PASTE_E2E: ${{ inputs.paste_e2e }}
          PASTE_E2E_OUT: ${{ runner.temp }}/paste-e2e
          PASTE_E2E_CODEX: ${{ runner.temp }}/paste-codex
          PASTE_E2E_CLAUDE: ${{ steps.claudebin.outputs.dir }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/paste-e2e/report-macos.json
        run: npx playwright test tests/e2e/paste-unix.spec.ts --retries=0 --workers=1 --reporter=list,json

      - name: Fail a macOS run Playwright retried or reported flaky
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/paste-e2e/report-macos.json
        run: node scripts/ci/playwright-no-retry.mjs "$REPORT"

      - name: Remove xclip and wl-clipboard (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get remove -y -q xclip wl-clipboard

      - name: Run the paste end-to-end check, neither program (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PASTE_E2E: ${{ inputs.paste_e2e }}
          PASTE_E2E_LINUX_TOOLS: none
          PASTE_E2E_OUT: ${{ runner.temp }}/paste-e2e
          PASTE_E2E_CODEX: ${{ runner.temp }}/paste-codex
          PASTE_E2E_CLAUDE: ${{ steps.claudebin.outputs.dir }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/paste-e2e/report-linux-none.json
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test tests/e2e/paste-unix.spec.ts --retries=0 --workers=1 --reporter=list,json

      - name: Fail a Linux run Playwright retried or reported flaky, neither program
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/paste-e2e/report-linux-none.json
        run: node scripts/ci/playwright-no-retry.mjs "$REPORT"

      - name: Install xclip (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        run: sudo apt-get install -y -q xclip

      - name: Run the paste end-to-end check, xclip (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        env:
          PASTE_E2E: ${{ inputs.paste_e2e }}
          PASTE_E2E_LINUX_TOOLS: xclip
          PASTE_E2E_OUT: ${{ runner.temp }}/paste-e2e
          PASTE_E2E_CODEX: ${{ runner.temp }}/paste-codex
          PASTE_E2E_CLAUDE: ${{ steps.claudebin.outputs.dir }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/paste-e2e/report-linux-xclip.json
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test tests/e2e/paste-unix.spec.ts --retries=0 --workers=1 --reporter=list,json

      - name: Fail a Linux run Playwright retried or reported flaky, xclip
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/paste-e2e/report-linux-xclip.json
        run: node scripts/ci/playwright-no-retry.mjs "$REPORT"

      - name: Swap xclip for wl-clipboard (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        run: |
          sudo apt-get remove -y -q xclip
          sudo apt-get install -y -q wl-clipboard

      - name: Run the paste end-to-end check, wl-paste alone (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        env:
          PASTE_E2E: ${{ inputs.paste_e2e }}
          PASTE_E2E_LINUX_TOOLS: wl-paste
          PASTE_E2E_OUT: ${{ runner.temp }}/paste-e2e
          PASTE_E2E_CODEX: ${{ runner.temp }}/paste-codex
          PASTE_E2E_CLAUDE: ${{ steps.claudebin.outputs.dir }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/paste-e2e/report-linux-wl-paste.json
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test tests/e2e/paste-unix.spec.ts --retries=0 --workers=1 --reporter=list,json

      - name: Fail a Linux run Playwright retried or reported flaky, wl-paste alone
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/paste-e2e/report-linux-wl-paste.json
        run: node scripts/ci/playwright-no-retry.mjs "$REPORT"

      - name: Upload the readings and the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paste-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/paste-e2e
            test-results
          if-no-files-found: warn
          retention-days: 30

  # Real-CLI conformance for Claude Code (aicc_planning#368). It runs only when
  # asked: a dispatch with `claude_rc_version`, which the daily upstream CLI watch
  # (upstream-cli-watch.yml) does when a newer Claude Code is published. There is
  # no PR or push leg: nothing a PR changes can change what the published CLI
  # prints, and Claude Code ships almost daily.
  #
  # Two legs per OS: the app's own floor (CLAUDE_MIN_MANAGED_CLI_VERSION, read
  # from the code), which shows the checks themselves hold on a version they
  # were written against, and the dispatched version, the one being asked about.
  # Each runs the CLI with no sign-in, no network request of ours and no secret,
  # in a fresh, empty CLAUDE_CONFIG_DIR, and checks (tests/integration/
  # claude-cli-conformance.test.ts, which reads the help through
  # claude-conformance-lib.mjs):
  #   1. the install answers `claude --version` with the version asked for, the
  #      app's own reader (parseClaudeVersion) reads it, and the managed-launch
  #      floor check (claudeManagedCliCompatibility) accepts it;
  #   2. `claude --help` still lists every switch of the reviewer's constant
  #      command line (CLAUDE_REVIEW_ARGS), and --output-format still offers json;
  #   3. --permission-mode still offers every mode the launch picker writes;
  #   4. `claude auth --help` lists login, logout and status, and `claude auth
  #      login --help` lists the three sign-in methods and --email.
  # Not driven here, because each needs a sign-in, a model call or a live
  # session: the hooks run against a real Claude (tests/integration/hooks/
  # real-claude.test.ts), the statusline and transcript shapes, and the
  # authority census (scripts/gen-claude-authority-manifest.mjs), a maintainer
  # tool that compares with one pinned Windows binary byte for byte.
  #
  # The CLI is installed from its PLATFORM package (`@anthropic-ai/claude-code-
  # <os>-<arch>`: the native binary, no install script, no bin), with
  # --ignore-scripts, into a prefix of its own: nothing of Anthropic's or
  # anyone's runs at install time. The job holds no secrets, and every
  # third-party action is pinned by commit.
  claude-conformance:
    if: github.event_name == 'workflow_dispatch' && inputs.claude_rc_version != ''
    name: Claude Code CLI ${{ matrix.cli }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
        cli: [minimum, rc]
    env:
      CCC_CLAUDE_CONFORMANCE_KIND: ${{ matrix.cli }}
      CCC_CLAUDE_CONFORMANCE_PROVE_RED: ${{ inputs.conformance_prove_red && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      # The suite imports only pure modules of the app (the reviewer's argv, the
      # version floor, the sign-in methods, the permission modes), so there is no
      # native rebuild and no Electron binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve this leg's Claude Code version
        id: ver
        env:
          RC_VERSION: ${{ inputs.claude_rc_version }}
        run: node tests/integration/claude-conformance-ci.mjs version ${{ matrix.cli }}

      - name: Resolve this runner's Claude Code package
        id: pkg
        run: node tests/integration/claude-conformance-ci.mjs package

      - name: Install Claude Code ${{ steps.ver.outputs.version }} into its own prefix
        shell: bash
        env:
          CLAUDE_VERSION: ${{ steps.ver.outputs.version }}
          CLAUDE_PACKAGE: ${{ steps.pkg.outputs.package }}
          PREFIX: ${{ runner.temp }}/claude-${{ matrix.cli }}
          NPM_CACHE: ${{ runner.temp }}/npm-claude-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "$CLAUDE_PACKAGE@$CLAUDE_VERSION"

      # bash on every OS: the default shell on Windows is PowerShell, where `$NAME`
      # is not an environment variable.
      - name: Locate the installed CLI
        id: bin
        shell: bash
        env:
          CLAUDE_PACKAGE: ${{ steps.pkg.outputs.package }}
          PREFIX: ${{ runner.temp }}/claude-${{ matrix.cli }}
        run: node tests/integration/claude-conformance-ci.mjs bin "$PREFIX" "$CLAUDE_PACKAGE"

      - name: A fresh, empty Claude Code folder for every run of the CLI
        id: home
        run: node tests/integration/claude-conformance-ci.mjs config

      - name: Real-CLI conformance (version, reviewer switches, permission modes, sign-in commands)
        env:
          CCC_CLAUDE_CONFORMANCE_BIN: ${{ steps.bin.outputs.bin }}
          CCC_CLAUDE_CONFORMANCE_VERSION: ${{ steps.ver.outputs.version }}
          CCC_CLAUDE_CONFORMANCE_CONFIG_DIR: ${{ steps.home.outputs.config }}
        run: npx vitest run tests/integration/claude-cli-conformance.test.ts

  # SSH multi-session smoke (#24 regression gate; aicc_planning#28). Real `ssh`
  # against an EPHEMERAL localhost sshd — no external hosts or credentials, so
  # unlike the retired manual live matrix this CAN run in CI. It proves the
  # per-session MCP reverse-tunnel ports coexist (two sessions to one host) and
  # that the old single-fixed-port shape collides. It exercises only the SSH
  # connection / `-R` / argv layer (child_process ssh + the pure argv builder) —
  # NOT claude/tmux/statusline, which still need the manual matrix.
  #
  # ALWAYS runs on PRs (not `ci-run`-gated), so it reports on every PR event
  # and could be made a required status check.
  ssh-smoke:
    name: SSH multi-session smoke (#24)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Provision an ephemeral key-auth sshd (TCP forwarding on)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server netcat-openbsd
          # The runner account is password-locked in /etc/shadow; sshd (UsePAM no)
          # refuses locked accounts even for pubkey auth. Set a throwaway password
          # to UNLOCK it — PasswordAuthentication stays off, so it's never usable
          # for login; the ephemeral runner is discarded after the job.
          echo "$(whoami):ci-ssh-smoke-$(date +%s)" | sudo chpasswd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          D="$RUNNER_TEMP/sshd"; mkdir -p "$D"
          ssh-keygen -t ed25519 -N '' -f "$D/hostkey" -q
          cat > "$D/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $D/hostkey
          PidFile $D/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PasswordAuthentication no
          PubkeyAuthentication yes
          AllowTcpForwarding yes
          UsePAM no
          StrictModes no
          LogLevel VERBOSE
          EOF
          sudo mkdir -p /run/sshd
          sudo "$(command -v sshd)" -t -f "$D/sshd_config"
          sudo "$(command -v sshd)" -f "$D/sshd_config" -E "$D/sshd.log"
          for i in $(seq 1 20); do nc -z 127.0.0.1 2222 && break; sleep 0.5; done
          nc -z 127.0.0.1 2222 || { echo "sshd failed to start"; sudo cat "$D/sshd.log" 2>/dev/null || true; exit 1; }
          # prove key auth + forwarding before the test, surfacing sshd errors early
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p 2222 "$(whoami)@127.0.0.1" 'echo SSHD_UP' || { sudo cat "$D/sshd.log" 2>/dev/null || true; exit 1; }
      - name: Write live host entry (localhost)
        run: |
          mkdir -p tests/live
          printf '{ "linuxKey": { "host": "127.0.0.1", "username": "%s", "port": 2222 } }\n' "$(whoami)" > tests/live/hosts.local.json
      - name: SSH multi-session -R test (#24)
        run: npx vitest run --config vitest.live.config.ts tests/live/ssh-multisession.live.ts

  # Remote helper device check (plan 2.1.3-beta.17, section A2, rule 35;
  # aicc_planning#411). The app's own remote-helper code (src/main/remote-helper/,
  # no Electron) under Node, against an ephemeral localhost sshd on this runner
  # (as ssh-smoke makes it): no host and no secret. It builds the static Linux
  # helper (with its bridge mode) and aicc-fake-cli here, writes the helper's
  # manifest with the installer's own script, gives the account an rc file that prints a
  # line and sets a variable and a `claude` on PATH that only an interactive
  # login shell sees, then runs tests/live/remote-helper-device.live.ts once,
  # with retries off: Add (upload, hash equal, self-test), another install's
  # Remove refused, a session holding the fake CLI (bytes in, output out, the
  # rc variable), a resize, the ssh child killed and a re-attach with the
  # replay; from 2.1.3-beta.18 (section 3.2) a tab's status line, hook events
  # and tool calls, posted on the host by the helper's status, hook and relay
  # modes as its session files name them, reaching the app's side once each,
  # and again after the ssh child is killed (what was posted in the cut
  # arrives once it is back), and two tabs at once each getting only its own;
  # the end, Remove, nothing left under ~/.aicc. From 2.1.3-beta.21 (plan
  # phase 6, aicc_planning#446) it then runs tests/live/remote-review.live.ts:
  # probes PV1 and PV2 against the stand-in Codex the rc step puts on the login
  # PATH (helper/probes/pv-codex-stand-in.cjs; its header says why not the real
  # Codex), the gate they decide (the app build's record of a PASS by
  # architecture, never a file on the host), and one codex_review from a
  # Claude Code tab through the relay, run on the machine, whose footer names
  # it.
  #
  # It runs ONLY on a dispatch that names it (`remote_helper_e2e`), never on a
  # pull request or a push. It is section evidence, like a test-machine line:
  # not one of the checks a PR waits for, not in release.yml and not read by
  # scripts/release-gate.mjs. It only reads: no secret, read-only permissions,
  # the actions pinned by commit. What is uploaded as remote-helper-e2e is the
  # two programs it built and the helper's manifest (a host line from a test
  # PC runs the same file with them) and the readings. tests/unit/scripts/remote-helper-e2e-job.test.ts
  # evaluates its condition.
  remote-helper-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.remote_helper_e2e == true
    name: Remote helper e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install the pinned Rust toolchain and the musl target
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          rustc --version

      # As the Helper job's static build: musl, so it runs on any Linux x86-64.
      # The helper goes where release.yml hands it to the Windows package
      # (target/helper-linux-musl), which is also where a dev run of the app
      # reads it (src/main/remote-helper/manifest.ts).
      - name: Build the static helper and the fake CLI
        shell: bash
        working-directory: helper
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin aicc-helper --bin aicc-fake-cli
          mkdir -p target/helper-linux-musl target/remote-helper-e2e
          cp target/x86_64-unknown-linux-musl/release/aicc-helper target/helper-linux-musl/
          cp target/x86_64-unknown-linux-musl/release/aicc-helper target/x86_64-unknown-linux-musl/release/aicc-fake-cli target/remote-helper-e2e/

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The manifest the Windows installer carries, written by the script the
      # packaging runs (A1's), which also refuses a helper that is not a static
      # x86-64 program. The check reads the helper through it, as the app does.
      # This job builds the x86-64 helper only (the arm64 one is built and run
      # by its own job), so the manifest lists what it has (--only-present), as
      # a dev run's does.
      - name: Write the helper's manifest as for the installer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-helper-manifest.mjs --only-present
          cp helper/target/helper-manifest/manifest.json helper/target/remote-helper-e2e/manifest.json

      - name: Provision an ephemeral key-auth sshd
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server netcat-openbsd
          # Unlock the password-locked runner account for key sign-in (sshd with
          # UsePAM no refuses a locked account); password sign-in stays off.
          echo "$(whoami):ci-remote-helper-$(date +%s)" | sudo chpasswd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          D="$RUNNER_TEMP/sshd"; mkdir -p "$D"
          ssh-keygen -t ed25519 -N '' -f "$D/hostkey" -q
          cat > "$D/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $D/hostkey
          PidFile $D/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PasswordAuthentication no
          PubkeyAuthentication yes
          AllowTcpForwarding no
          UsePAM no
          StrictModes no
          LogLevel VERBOSE
          EOF
          sudo mkdir -p /run/sshd
          sudo "$(command -v sshd)" -t -f "$D/sshd_config"
          sudo "$(command -v sshd)" -f "$D/sshd_config" -E "$D/sshd.log"
          for i in $(seq 1 20); do nc -z 127.0.0.1 2222 && break; sleep 0.5; done
          nc -z 127.0.0.1 2222 || { echo "sshd failed to start"; sudo cat "$D/sshd.log" 2>/dev/null || true; exit 1; }
          # Its host key goes into known_hosts here; the app's own first exec
          # would take it the same way (accept-new), every later one only it.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p 2222 "$(whoami)@127.0.0.1" 'echo SSHD_UP' || { sudo cat "$D/sshd.log" 2>/dev/null || true; exit 1; }

      # What a real account's rc files do: ~/.bashrc prints a line on every
      # start (the scripts and the bridge drop it), and only an interactive
      # login shell gets AICC_RC_MARK and a `claude` on PATH (P6's fallback,
      # ADR-030). The two checks after it show the exec sees neither and
      # `bash -il` sees both, or the step fails.
      - name: Give the account rc files as a real one has
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/aicc-e2e-bin"
          cp helper/target/remote-helper-e2e/aicc-fake-cli "$HOME/aicc-e2e-bin/claude"
          # The review check's stand-in Codex (2.1.3-beta.21), found the same way.
          cp helper/probes/pv-codex-stand-in.cjs "$HOME/aicc-e2e-bin/codex"
          chmod 755 "$HOME/aicc-e2e-bin/codex"
          old="$RUNNER_TEMP/bashrc.old"
          cp "$HOME/.bashrc" "$old" 2>/dev/null || : > "$old"
          {
            echo 'echo "rc file: hello from ~/.bashrc"'
            cat "$old"
            echo 'case $- in *i*) export AICC_RC_MARK=from-rc; export PATH="$HOME/aicc-e2e-bin:$PATH";; esac'
          } > "$HOME/.bashrc"
          echo '[ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"' >> "$HOME/.bash_profile"
          exec_sees=$(ssh -o BatchMode=yes -p 2222 "$(whoami)@127.0.0.1" 'echo "${AICC_RC_MARK:-unset} $(command -v claude || echo none)"' | tail -n 1)
          il_sees=$(bash -ilc 'echo "${AICC_RC_MARK:-unset} $(command -v claude || echo none)"' </dev/null 2>/dev/null | tail -n 1)
          echo "an exec sees: $exec_sees"
          echo "an interactive login shell sees: $il_sees"
          [ "$exec_sees" = "unset none" ] || { echo "::error::the exec sees what only a login shell should"; exit 1; }
          [ "$il_sees" = "from-rc $HOME/aicc-e2e-bin/claude" ] || { echo "::error::bash -il does not see the rc file's variable and claude"; exit 1; }
          codex_sees=$(bash -ilc 'command -v codex && codex --version' </dev/null 2>/dev/null | tail -n 2 | tr '\n' ' ')
          echo "an interactive login shell's codex: $codex_sees"
          [ "$codex_sees" = "$HOME/aicc-e2e-bin/codex codex-cli 0.157.1 " ] || { echo "::error::bash -il does not run the stand-in Codex"; exit 1; }

      - name: Write the hosts file (no secret)
        shell: bash
        env:
          OUT: ${{ runner.temp }}/remote-helper-e2e
        run: |
          mkdir -p "$OUT"
          printf '{ "host": "127.0.0.1", "user": "%s", "port": 2222 }\n' "$(whoami)" > "$OUT/hosts.json"

      # The default vitest config does not include tests/live, so no other
      # suite runs it; vitest fails when no test file is found, and the next
      # step fails a run in which no test ran or one was retried.
      - name: Run the remote helper device check
        shell: bash
        env:
          REMOTE_HELPER_HOSTS: ${{ runner.temp }}/remote-helper-e2e/hosts.json
          REMOTE_HELPER_BIN: helper/target/helper-linux-musl/aicc-helper
          REMOTE_HELPER_MANIFEST: helper/target/helper-manifest/manifest.json
          REMOTE_HELPER_FAKE_CLI: helper/target/remote-helper-e2e/aicc-fake-cli
          REMOTE_HELPER_EXPECT_RC: '1'
          REMOTE_HELPER_OUT: ${{ runner.temp }}/remote-helper-e2e
        run: npx vitest run --config vitest.live.config.ts tests/live/remote-helper-device.live.ts --retry=0 --reporter=default --reporter=json --outputFile.json="$REMOTE_HELPER_OUT/vitest.json"

      - name: Fail a run in which no test ran, or one did not pass
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/remote-helper-e2e/vitest.json
        run: node scripts/ci/vitest-ran.mjs "$REPORT"

      # 2.1.3-beta.21 (plan phase 6, aicc_planning#446): probes PV1 and PV2 and
      # a review on the machine, after the device check (never beside it: both
      # use the account's ~/.aicc), also when that check was red.
      - name: Run the review check on the machine (probes PV1 and PV2, and a review there)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REMOTE_HELPER_HOSTS: ${{ runner.temp }}/remote-helper-e2e/hosts.json
          REMOTE_HELPER_BIN: helper/target/helper-linux-musl/aicc-helper
          REMOTE_HELPER_MANIFEST: helper/target/helper-manifest/manifest.json
          REMOTE_HELPER_FAKE_CLI: helper/target/remote-helper-e2e/aicc-fake-cli
          REMOTE_REVIEW_CODEX: stand-in
          REMOTE_HELPER_OUT: ${{ runner.temp }}/remote-helper-e2e
        run: npx vitest run --config vitest.live.config.ts tests/live/remote-review.live.ts --retry=0 --reporter=default --reporter=json --outputFile.json="$REMOTE_HELPER_OUT/vitest-review.json"

      - name: Fail the review check when no test ran, or one did not pass
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/remote-helper-e2e/vitest-review.json
        run: node scripts/ci/vitest-ran.mjs "$REPORT"

      - name: Upload the two programs, the manifest and the readings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: remote-helper-e2e
          path: |
            helper/target/remote-helper-e2e
            ${{ runner.temp }}/remote-helper-e2e
          if-no-files-found: warn
          retention-days: 14


  # The Rust session helper (helper/; ADR-029, ADR-030). The installers carry
  # its release build (release.yml builds it, and so do the release/* packaging
  # steps above), and the app runs plain terminals through it only when the
  # setting is on. This job is NOT a required check and nothing waits on it.
  # It builds and tests the helper on the three OSes it runs on, and uploads
  # the Windows build. On Windows it also fails if the release build imports a
  # C runtime DLL (scripts/check-pe-imports.mjs). On Linux it also builds a
  # static helper, checks it is static and uploads it (helper-linux-musl):
  # from 2.1.3-beta.17 the Windows installer carries that file for Linux
  # machines, built by release.yml's helper-linux job with these same steps,
  # and a VM or dev package takes it from this artifact (the arm64 file, from
  # 2.1.3-beta.19, comes from the helper-linux-arm64 job below). Probe P7
  # (helper/probes/p7-windows-survival.ps1) is answered (2026-11-15, ADR-030);
  # its script rides in the artifact as the record of how, and it drives
  # commands this build no longer has, so running it again needs a
  # 2.1.3-beta.5 helper-windows artifact.
  #
  # Its job condition is the Test jobs' event rule and one dispatch case, nothing
  # else: it starts on a push, on a dispatch that names it (the `helper` input;
  # github.event.inputs gives each input as a string, so it is compared with
  # 'true'), and on a pull request except for a label change other than `ci-run`
  # and an edit that is not a base change, which change no code and would only
  # rebuild three runners (the `ci-run` label is kept so the run that replaces
  # an in-flight one in the same group still builds). The paths are never part
  # of it. The dispatch case lets a helper/ section be built and tested on its
  # pushed branch before its pull request opens (plan 2.1.3-beta.12, C1).
  #
  # It decides INSIDE the job, exactly as the Test jobs do (change-scope.mjs):
  # on the events that start it, the job starts on all three runners, scripts/ci/helper-scope.mjs says
  # whether a helper path (or this workflow) changed, and every step after it
  # carries `steps.scope.outputs.helper != 'false'` - only the literal 'false'
  # skips. A job-level path filter is never used here. The Test (os) jobs above
  # are not touched by it, and its name does not begin with `Test (`, so the
  # release gate and the green-run reuse (TEST_JOB_RE) never read it.
  #
  # Cargo.lock: until it is committed the job cannot build with --locked. It
  # then generates one, uploads it as the `helper-cargo-lock` artifact (from the
  # Linux job) and FAILS, saying to commit it. Once it is committed, every build
  # and test runs with --locked.
  #
  # Actions are pinned by commit (threat model 3.10); the comment names the tag.
  helper:
    name: Helper (${{ matrix.os }})
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.helper == 'true') ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      # Depth 2: on a PR this is the merge commit and its parents, so the next
      # step can read what the PR changes against its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether the helper changed
        id: scope
        run: node scripts/ci/helper-scope.mjs

      - name: Install the pinned Rust toolchain
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Check that Cargo.lock is committed
        id: lock
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: |
          if [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            cargo generate-lockfile
          fi

      - name: Upload the generated Cargo.lock
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'false' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helper-cargo-lock
          path: helper/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Fail until Cargo.lock is committed
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'false'
        shell: bash
        run: |
          echo "::error title=helper/Cargo.lock is not committed::Download the helper-cargo-lock artifact of this run (it is uploaded by the Linux job), commit it as helper/Cargo.lock, and push. Every helper build runs with --locked."
          exit 1

      # The budget is under 25 crates including the helper itself (threat model 3.10).
      - name: Count the crates in Cargo.lock
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true'
        shell: bash
        working-directory: helper
        run: |
          n=$(grep -c '^name = ' Cargo.lock)
          echo "Cargo.lock lists $n packages, the helper itself included (limit 24)."
          echo "Cargo.lock lists $n packages, the helper itself included (limit 24)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 24 ]; then
            echo "::error::Cargo.lock lists $n packages; the budget is under 25 including the helper."
            exit 1
          fi

      # No network code anywhere in the helper (threat model 3.10): its transport
      # is a local socket or pipe only.
      - name: No networking in the helper source
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true'
        shell: bash
        working-directory: helper
        run: |
          if grep -rnE 'std::net|TcpStream|TcpListener|UdpSocket|ToSocketAddrs' src tests; then
            echo "::error::networking types found in the helper source"
            exit 1
          fi
          echo "no networking types in src/ or tests/"

      - name: Build
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true'
        shell: bash
        working-directory: helper
        run: cargo build --locked --all-targets

      - name: Test
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true'
        shell: bash
        working-directory: helper
        timeout-minutes: 15
        run: cargo test --locked

      # The P7 script goes in as the record of how the probe ran (see the job's
      # header); it needs a 2.1.3-beta.5 artifact to run again.
      - name: Build the Windows release binaries
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true' && runner.os == 'Windows'
        shell: bash
        working-directory: helper
        run: |
          cargo build --locked --release
          mkdir -p target/helper-windows
          cp target/release/aicc-helper.exe target/release/aicc-fake-cli.exe target/helper-windows/
          cp probes/p7-windows-survival.ps1 probes/README.md target/helper-windows/

      # The helper must start on a PC without Microsoft's Visual C++ runtime, so
      # it carries its own C runtime (helper/.cargo/config.toml, +crt-static).
      # This reads the built program's import table and fails if it still
      # imports a C runtime DLL (VCRUNTIME140.dll, api-ms-win-crt-*, ...), or
      # imports a window-manager DLL (user32, gdi32, shcore) at load time rather
      # than delay-loading it for the capture mode alone. It only reads the
      # file. release.yml runs the same check before packaging.
      - name: Check the Windows helper carries its own C runtime
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true' && runner.os == 'Windows'
        run: node scripts/check-pe-imports.mjs helper/target/release/aicc-helper.exe

      - name: Upload the Windows helper
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helper-windows
          path: helper/target/helper-windows
          if-no-files-found: error
          retention-days: 14

      # A static Linux helper (plan 2.1.3-beta.13 C2, aicc_planning#377): probes
      # P3 and P6 (ADR-030) run the helper on remote Linux hosts, and the build
      # above links this runner's glibc 2.39, newer than some hosts have. On Unix
      # the helper needs only libc and vt100 (helper/Cargo.toml), both Rust
      # crates, so the musl target links it with the C library that Rust's musl
      # target carries itself: no package is installed. From 2.1.3-beta.17 the
      # Windows installer carries this file (resources/helper/linux-x64/aicc-helper)
      # for the app to upload to a Linux machine: release.yml's helper-linux job
      # and the release/* test installer's Linux job build it with these three
      # steps word for word (tests/unit/scripts/helper-release-job.test.ts).
      - name: Build the static Linux helper
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true' && runner.os == 'Linux'
        shell: bash
        working-directory: helper
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin aicc-helper
          mkdir -p target/helper-linux-musl
          cp target/x86_64-unknown-linux-musl/release/aicc-helper target/helper-linux-musl/

      # Static means: an x86-64 ELF file that names no program interpreter
      # (no INTERP header) and no shared library (no NEEDED entry). It only reads
      # the files. The same check then runs on the debug build above, which links
      # glibc, and must find it not static there, so every run shows the check
      # can fail.
      - name: Check the Linux helper is static
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true' && runner.os == 'Linux'
        shell: bash
        working-directory: helper
        run: |
          # 0 static, 1 not static, 2 not an x86-64 ELF file or not read.
          is_static() {
            local hdr segs dyn
            hdr=$(readelf --file-header --wide "$1") || return 2
            grep -q 'Class:[[:space:]]*ELF64' <<<"$hdr" || return 2
            grep -q 'Machine:[[:space:]]*Advanced Micro Devices X86-64' <<<"$hdr" || return 2
            segs=$(readelf --program-headers --wide "$1") || return 2
            dyn=$(readelf --dynamic --wide "$1") || return 2
            grep -q 'INTERP' <<<"$segs" && return 1
            grep -q '(NEEDED)' <<<"$dyn" && return 1
            return 0
          }
          built=target/helper-linux-musl/aicc-helper
          rc=0; is_static "$built" || rc=$?
          file "$built"
          echo "Static Linux helper: $(file -b "$built"), $(stat -c %s "$built") bytes." >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::error::$built is not a static x86-64 ELF program (check status $rc)"
            exit 1
          fi
          rc=0; is_static target/debug/aicc-helper || rc=$?
          if [ "$rc" != 1 ]; then
            echo "::error::the check did not find the glibc debug build dynamic (check status $rc), so it proves nothing"
            exit 1
          fi
          echo "static: $built; the check finds the glibc debug build dynamic, as it must"

      - name: Upload the static Linux helper
        if: steps.scope.outputs.helper != 'false' && steps.lock.outputs.present == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helper-linux-musl
          path: helper/target/helper-linux-musl
          if-no-files-found: error
          retention-days: 14

  # The session helper on arm64 Linux (2.1.3-beta.19, section 1.3,
  # aicc_planning#438): from 2.1.3-beta.19 the Windows installer also carries
  # an arm64 static Linux helper (resources/helper/linux-arm64/aicc-helper), so
  # an arm64 machine, a Raspberry Pi 5 for one, can be added. This job runs on
  # GitHub's arm64 runner (ubuntu-24.04-arm): it builds and tests the helper
  # there as the Helper job does on the other three, then builds the release
  # helper for aarch64-unknown-linux-musl natively, so no cross linker is
  # needed and the file runs once here (`version`, which must name this crate's
  # version). The static check is the Helper job's, for the AArch64 machine: no
  # program interpreter and no shared library, so it runs on any arm64 Linux
  # whatever its glibc (Debian 12 and 13 among them), and the same check must
  # find this runner's glibc debug build dynamic. It uploads the file as
  # helper-linux-musl-arm64. release.yml's helper-linux-arm64 job and the
  # release/* test installer's arm64 job build it with these four steps word
  # for word (tests/unit/scripts/helper-release-job.test.ts).
  #
  # Its condition, its in-job decision (scripts/ci/helper-scope.mjs) and its
  # step conditions are the Helper job's, so a dispatch that names `helper`
  # runs it too; like that job it is NOT a required check and nothing waits on
  # it. It has no Cargo.lock step of its own: the Helper job's Linux leg
  # uploads a generated lock and fails when none is committed, and every cargo
  # step here runs with --locked, which fails without one.
  helper-linux-arm64:
    name: Helper (ubuntu-24.04-arm)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.helper == 'true') ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether the helper changed
        id: scope
        run: node scripts/ci/helper-scope.mjs

      - name: Install the pinned Rust toolchain
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: cargo build --locked --all-targets

      - name: Test
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        timeout-minutes: 15
        run: cargo test --locked

      - name: Build the static arm64 Linux helper
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --locked --release --target aarch64-unknown-linux-musl --bin aicc-helper
          mkdir -p target/helper-linux-musl-arm64
          cp target/aarch64-unknown-linux-musl/release/aicc-helper target/helper-linux-musl-arm64/

      # Static means: an AArch64 ELF file that names no program interpreter (no
      # INTERP header) and no shared library (no NEEDED entry). It only reads
      # the files, and must find the glibc debug build above dynamic.
      - name: Check the arm64 Linux helper is static
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: |
          # 0 static, 1 not static, 2 not an AArch64 ELF file or not read.
          is_static() {
            local hdr segs dyn
            hdr=$(readelf --file-header --wide "$1") || return 2
            grep -q 'Class:[[:space:]]*ELF64' <<<"$hdr" || return 2
            grep -q 'Machine:[[:space:]]*AArch64' <<<"$hdr" || return 2
            segs=$(readelf --program-headers --wide "$1") || return 2
            dyn=$(readelf --dynamic --wide "$1") || return 2
            grep -q 'INTERP' <<<"$segs" && return 1
            grep -q '(NEEDED)' <<<"$dyn" && return 1
            return 0
          }
          built=target/helper-linux-musl-arm64/aicc-helper
          rc=0; is_static "$built" || rc=$?
          file "$built"
          echo "Static arm64 Linux helper: $(file -b "$built"), $(stat -c %s "$built") bytes." >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ]; then
            echo "::error::$built is not a static AArch64 ELF program (check status $rc)"
            exit 1
          fi
          rc=0; is_static target/debug/aicc-helper || rc=$?
          if [ "$rc" != 1 ]; then
            echo "::error::the check did not find the glibc debug build dynamic (check status $rc), so it proves nothing"
            exit 1
          fi
          echo "static: $built; the check finds the glibc debug build dynamic, as it must"

      # The file runs here, on the machine kind it is for: `version` must print
      # this crate's version, read from helper/Cargo.toml's package section.
      - name: Run the arm64 Linux helper once
        if: steps.scope.outputs.helper != 'false'
        shell: bash
        working-directory: helper
        run: |
          want="aicc-helper $(awk -F'"' '/^\[/ { p = ($0 == "[package]") } p && /^version = / { print $2; exit }' Cargo.toml)"
          said=$(target/helper-linux-musl-arm64/aicc-helper version)
          echo "The arm64 Linux helper ran here: $said" >> "$GITHUB_STEP_SUMMARY"
          if [ "$said" != "$want" ]; then
            echo "::error::target/helper-linux-musl-arm64/aicc-helper version says \"$said\", not \"$want\""
            exit 1
          fi
          echo "ran: $said"

      - name: Upload the static arm64 Linux helper
        if: steps.scope.outputs.helper != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helper-linux-musl-arm64
          path: helper/target/helper-linux-musl-arm64
          if-no-files-found: error
          retention-days: 14

  # PR numbers (ADR-030, SDLC table): on every pull request, a short table in the
  # job summary - how long is src/main/pty-manager.ts against its cap (the live
  # SSH matrix it also reported is retired, owner 2026-11-22). It FAILS only
  # when pty-manager.ts grows past the cap, and the `cap-override` label lets
  # that pass (the summary says so).
  #
  # The job's only `if` is event-scoped (`pull_request`), and that is the whole
  # design, the same as `desktop-gate`: it ALWAYS runs on a pull request and
  # decides INSIDE, in scripts/ci/pr-numbers.mjs. Never turn the changed paths or
  # the labels into a job-level or step-level `if:`: a job skipped by its
  # condition reports as passed, and a job behind a path filter never reports at
  # all. It is not a required check today; it may become one only because it
  # always runs. Labels are read from the event, so adding or removing
  # `cap-override` (`labeled` / `unlabeled`) runs it again.
  #
  # Checked out with depth 2, so the merge commit and its parents give the PR's
  # changed paths and the base's copy of pty-manager.ts. The job only reads.
  # The action is pinned by commit.
  pr-numbers:
    name: PR numbers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Print the PR's numbers - fails only if pty-manager.ts grows past its cap
        run: node scripts/ci/pr-numbers.mjs
