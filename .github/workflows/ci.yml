name: CI

on:
  pull_request:
    # `labeled` asks for the tests (`ci-run`). `labeled`, `unlabeled` and
    # `edited` are here for the Desktop test gate below, which keys on the PR's
    # labels AND on its base branch: removing `desktop-tested` from a PR into
    # main must turn the check red again (#309), and a PR that passed on a
    # `beta` base and is then retargeted to `main` must be decided again
    # (`edited` is the only event a base change sends). Neither restarts the
    # tests: see the `concurrency` block and the `test` job's condition.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches: [main, beta, 'release/**']
  push:
    branches: [main]
  # Release level (P4.8; OD20 D7, WP1.71): the release-candidate Codex CLI is
  # checked on its own, dispatched with its version, besides the minimum and
  # pinned ones every run checks. On a dispatch the codex-conformance job runs,
  # with the always-on changelog check; every other job's condition skips it.
  # The inputs reach a step through env, never a shell line.
  workflow_dispatch:
    inputs:
      codex_rc_version:
        description: 'Release-candidate Codex CLI version to check as well (a plain semver, for example 0.160.0); empty checks the minimum and pinned only'
        type: string
        required: false
        default: ''
      conformance_prove_red:
        description: 'Run every real-CLI conformance check against a deliberately wrong expectation: the job must go red, each check named'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A newer run supersedes the older one (ADR-028, rule 6), where that is safe:
#   - The code events of one PR share a group that cancels: opened,
#     synchronize, reopened, `ci-run` being added (which asks for the tests),
#     and the base branch being changed (which changes the merge under test).
#     A push to the PR stops the run on the commit it replaced.
#   - Every other label change, and every other edit (a title, a description),
#     runs in a second group per PR, so it can never cancel the tests of the
#     same PR. Those runs only re-decide the label and base checks (see the
#     `test` job's condition).
#   - A push (main is the only branch that pushes here) and a dispatch get a
#     group of their own per run: never cancelled, never queued behind another.
# release.yml has no concurrency at all: a release is never cancelled.
# tests/unit/scripts/ci-cadence.test.ts evaluates these two expressions against
# each event.
concurrency:
  group: >-
    ${{
      github.event_name != 'pull_request' && format('ci-run-{0}', github.run_id)
      || (github.event.action == 'labeled' && github.event.label.name != 'ci-run'
          || github.event.action == 'unlabeled'
          || github.event.action == 'edited' && github.event.changes.base.ref.from == '')
         && format('ci-pr-{0}-labels', github.event.pull_request.number)
      || format('ci-pr-{0}', github.event.pull_request.number)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, always-on guard (not gated on the `ci-run` label): CHANGELOG.md is
  # generated from src/renderer/changelog.ts, so it must never drift. The
  # generator is zero-dependency, so no npm install is needed.
  changelog:
    name: Changelog in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Verify CHANGELOG.md matches changelog.ts
        run: node scripts/gen-changelog.js --check

  # Desktop test gate (#309; ADR-028, rule 9). Headless CI can pass while the
  # packaged app fails to run usefully on a real desktop (it has), so "was the
  # built app actually exercised?" is a real acceptance gate. The owner set its
  # level on 2026-11-14: desktop testing is at RELEASE level on beta and
  # PRE-RELEASE on stable, not per PR.
  #   - A PR into `beta` or a `release/*` line needs no label: this check
  #     reports success and says so. The owner desktop-tests the RELEASED beta
  #     build, and that test is an input to the stable promotion.
  #   - A PR into `main` (the stable promotion, release/vX.Y.Z -> main) must
  #     carry one of the labels, as every PR did before:
  #       `desktop-tested`    a HUMAN opened and exercised the packaged app
  #       `runtime-validated` AUTOMATED runtime validation passed (VM Playwright
  #                           e2e and/or the live SSH statusline matrix)
  #       `skip-desktop-test` nothing to exercise (docs/deps/CI/changelog-only)
  # Direct pushes to `main` have no PR and are exempt by the event guard.
  #
  # The job's only `if` is event-scoped (`pull_request`), and that is the whole
  # design: on every PR event it ALWAYS runs, then decides INSIDE, from the base
  # branch and the labels. Never turn either into a job-level `if:`: a job
  # skipped by its condition reports as passed, so a skip would wave a PR into
  # main through. Exactly one of the two steps runs (their conditions are each
  # other's negation; tests/unit/scripts/ci-cadence.test.ts evaluates both).
  #
  # The decision is redone whenever its inputs change: `labeled` / `unlabeled`
  # for the labels, `edited` for the base branch, so a PR cannot pass on a
  # `beta` base and keep that green after being retargeted to `main`. An empty
  # base cannot happen on a pull_request event; if it did, the label would be
  # required (fail closed).
  #
  # Keep the name exactly `Desktop test gate`: checks are known by name.
  desktop-gate:
    name: Desktop test gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Not a PR into main - desktop testing happens on the released beta
        if: github.event.pull_request.base.ref != 'main' && github.event.pull_request.base.ref != ''
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: echo "This PR targets '$BASE_REF', not main. Desktop testing happens on the released beta build, not per PR, and no label is needed. Gate open."

      - name: PR into main - require desktop-tested / runtime-validated (or skip-desktop-test) label
        if: github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == ''
        env:
          HAS_TESTED: ${{ contains(github.event.pull_request.labels.*.name, 'desktop-tested') }}
          HAS_RUNTIME: ${{ contains(github.event.pull_request.labels.*.name, 'runtime-validated') }}
          HAS_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-desktop-test') }}
        run: |
          if [ "$HAS_TESTED" = "true" ]; then
            echo "PR carries 'desktop-tested' — a human exercised the packaged app on a real desktop. Gate open."
            exit 0
          fi
          if [ "$HAS_RUNTIME" = "true" ]; then
            echo "PR carries 'runtime-validated' — automated runtime validation passed (VM Playwright e2e and/or the live SSH statusline matrix). Gate open."
            exit 0
          fi
          if [ "$HAS_SKIP" = "true" ]; then
            echo "PR carries 'skip-desktop-test' — no runtime test required (docs/deps/CI/changelog-only). Gate open."
            exit 0
          fi
          echo "::error::Desktop test gate: a PR into main (the stable promotion) must carry 'desktop-tested' (a human launched and exercised the packaged app), 'runtime-validated' (automated VM e2e and/or the live SSH statusline matrix passed), or 'skip-desktop-test' (docs/deps/CI/changelog-only) before it can merge. See CONTRIBUTING.md > Desktop-test gate."
          exit 1

  test:
    # Gate the test matrix on a `ci-run` label for PRs.
    # Rationale: this repo accumulates many WIP commits per PR (multi-phase v1.x
    # branches sit open for weeks while P0..PN land). Running the full Win/macOS
    # matrix on every push wastes minutes and creates red-X noise on intermediate
    # commits. Apply the `ci-run` label when the PR is ready for a real CI gate
    # (e.g. before requesting human review, before merge, or after a fix-loop).
    # Direct pushes to `main` always run CI as the final pre-merge guard.
    #
    # A label change does not restart the tests (ADR-028, rule 6): on a
    # `labeled` event the matrix runs only when the label added is `ci-run`
    # itself, and on an `unlabeled` event never. Nor does an edit of the PR's
    # title or description: on an `edited` event the matrix runs only when the
    # base branch changed, because the merge under test is then another one.
    # The results already reported for the commit stand. (The cheap always-on
    # jobs, `changelog` and `ssh-smoke`, do run again on a label change or an
    # edit, about a minute in all: a job skipped by its condition reports as
    # passed under its own name, which would sit over an earlier red result
    # for the same commit.)
    #
    # `Test (windows-2025)` and `Test (macos-latest)` are REQUIRED checks in
    # the branch rulesets. Never gate this job on the changed paths, here or
    # with a workflow-level path filter: a job skipped as a whole never reports
    # those names and the PR waits forever. The paths are read INSIDE the job
    # ("Decide the scope" below), which then ends green.
    if: |
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux joined the matrix with P4.8 (OD20 D5) and was non-blocking until
    # its first green run (CI run 37134624406, recorded in
    # docs/wp1/evidence/ci-matrix.md). It blocks now: a Linux failure fails
    # the run like any other (PR 4 package gate 7 needs Windows, macOS and
    # Linux green).
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 pinned (not -latest): the windows-2025-vs2026 image that
        # windows-latest now redirects to ships ONLY Visual Studio 2026 ("18"),
        # which @electron/node-gyp cannot use yet -> better-sqlite3 rebuild fails.
        # Unpin once the electron toolchain supports VS 2026.
        # ubuntu-latest takes the native rebuild path below, as macOS does.
        os: [windows-2025, macos-latest, ubuntu-latest]

    steps:
      # Depth 2: on a PR this is the merge commit and its parents, so the next
      # step can read what the PR changes against its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # CI runs only what a change touches (ADR-028, rule 6), the safe minimum:
      # a PR that changes ONLY documentation (Markdown, docs/, CONTEXT.d/,
      # architecture/) skips the suite on Windows and macOS. Linux always runs
      # it, because some tests read the Markdown they guard. The job itself
      # still runs and ends green, so the required checks report.
      #
      # EVERY step below carries `steps.scope.outputs.suite != 'false'`: only
      # the literal 'false' skips, so an output that was never written runs the
      # suite (scripts/ci/change-scope.mjs; the test file named above checks
      # each step). A new step needs the same condition.
      - name: Decide the scope
        id: scope
        run: node scripts/ci/change-scope.mjs

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.suite != 'false'
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.suite != 'false'
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        if: steps.scope.outputs.suite != 'false'
        run: pip install setuptools

      - name: Install dependencies
        if: steps.scope.outputs.suite != 'false'
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        if: steps.scope.outputs.suite != 'false'
        run: node node_modules/electron/install.js

      # Windows: no VS Build Tools / native rebuild. node-pty and better-sqlite3
      # ship N-API prebuilt binaries (prebuilds/win32-x64) that load unchanged under
      # Electron (verified: test:unit:native loads SQLite under electron-as-node from
      # the prebuild), so we skip the rebuild on Windows and use them as-is. This drops
      # a dependency on community.chocolatey.org, whose per-IP rate limiting (behind
      # Cloudflare) intermittently blocks GitHub's SHARED runner IPs and failed the VS
      # Build Tools install at random with "not valid XML". macOS/Linux still rebuild
      # from source below.
      - name: Rebuild native modules
        if: steps.scope.outputs.suite != 'false' && runner.os != 'Windows'
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Typecheck
        if: steps.scope.outputs.suite != 'false'
        run: npm run typecheck

      # A WP1 gate test lists the tree of the commit its ledger is bound to, and
      # the checkout above is shallow: fetch exactly that one commit. Shared with
      # release.yml's test steps (see the script's header).
      - name: Fetch the WP1 ledger's bound commit
        if: steps.scope.outputs.suite != 'false'
        run: node scripts/wp1/fetch-ledger-commit.mjs

      - name: Unit tests
        if: steps.scope.outputs.suite != 'false'
        run: npx vitest run

      - name: Unit tests (native / SQLite under Electron-as-Node)
        if: steps.scope.outputs.suite != 'false'
        run: npm run test:unit:native

      - name: Build
        if: steps.scope.outputs.suite != 'false'
        run: npm run build

      # Beta-testing artifact pipeline.
      # When a PR's source branch starts with `release/` we also produce
      # platform installers and upload them as workflow artifacts so the
      # PR's Actions run page becomes the download point for each iteration
      # of a release candidate. Signing/notarisation are skipped here —
      # CI lacks the Apple Developer ID secrets the formal release workflow
      # uses, so the macOS DMG is unsigned and Gatekeeper will warn on
      # first launch (right-click → Open). The Windows installer is also
      # unsigned, same SmartScreen warning as the release pipeline.
      # Gate on runner.os, NOT a matrix image name: `matrix.os` carries whatever
      # image is pinned above, so a re-pin silently turns these steps off while
      # the job stays green.
      - name: Package Windows installer (release/* branches only)
        if: steps.scope.outputs.suite != 'false' && runner.os == 'Windows' && startsWith(github.head_ref, 'release/')
        # --config.npmRebuild=false: the Windows rebuild step is skipped (prebuilds),
        # so tell electron-builder not to rebuild either; package the prebuilds as-is.
        run: npx electron-builder --win --config.npmRebuild=false

      - name: Verify native modules unpacked (release/* branches only)
        if: steps.scope.outputs.suite != 'false' && runner.os == 'Windows' && startsWith(github.head_ref, 'release/')
        run: npm run verify:package

      - name: Package macOS DMG (release/* branches only)
        if: steps.scope.outputs.suite != 'false' && runner.os == 'macOS' && startsWith(github.head_ref, 'release/')
        run: npx electron-builder --mac

      - name: Upload Windows installer
        if: steps.scope.outputs.suite != 'false' && runner.os == 'Windows' && startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS DMG
        if: steps.scope.outputs.suite != 'false' && runner.os == 'macOS' && startsWith(github.head_ref, 'release/')
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # The record a beta release reads to reuse this run instead of running the
      # suite again (ADR-028, rule 4; scripts/ci/reuse-green-ci.mjs): the LAST
      # step of the job is named after the git tree the job checked out, and it
      # is reached only when every step above passed. On a PR that tree is the
      # merge of the branch into its base, so a branch behind its base records
      # the tree it really tested, not the tree of its own head. Keep these two
      # steps last, and never give them always() or continue-on-error.
      - name: Read the tree under test
        id: tree
        if: steps.scope.outputs.suite != 'false'
        shell: bash
        run: echo "sha=$(git rev-parse --verify 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Tested tree ${{ steps.tree.outputs.sha }}
        if: steps.scope.outputs.suite != 'false'
        shell: bash
        run: echo "The suite, the native tests and the build passed on this tree."

  # Real-CLI conformance (P4.8; rows 59, 60; OD20 D7, WP1.71). Each supported
  # Codex CLI version is installed into a prefix of its own on each OS and run
  # with no sign-in, each run in a fresh, empty Codex home: the app's discovery
  # (row 2's detection evidence per OS), the help of every command line the
  # app runs, the model list against the registry, the feature list, and the
  # flag-drift suite. P3.1's help captures are made again, uploaded, and
  # asserted against the normalised fixtures as each OS reads them: the
  # captures of each OS were reviewed (CI run 37134624406) and only the
  # differences reviewed are accepted (CCC_CODEX_HELP_ASSERT). See
  # tests/integration/codex-real-cli-conformance.test.ts and
  # docs/wp1/evidence/ci-matrix.md.
  #
  # PR and push runs check the minimum and the pinned version, both read from
  # src/main/providers/codex/cli-contract.ts. The release candidate is a
  # dispatch input (PR runs have none), checked at release level. The job
  # holds no secrets and installs only the published @openai/codex package.
  # Gated like the test matrix: the `ci-run` label on a PR, every push to main,
  # and not restarted by another label change or an edit (see the `test` job).
  codex-conformance:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-run') &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-run') &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    name: Codex CLI ${{ matrix.cli }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
        cli: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.codex_rc_version != '' && '["minimum","pinned","rc"]' || '["minimum","pinned"]') }}
    env:
      CCC_CODEX_CONFORMANCE_KIND: ${{ matrix.cli }}
      CCC_CODEX_CONFORMANCE_PROVE_RED: ${{ inputs.conformance_prove_red && '1' || '0' }}
      # '1' since the help captures of each OS were reviewed (P4.10; the
      # differences accepted are in tests/integration/codex-conformance-lib.ts).
      CCC_CODEX_HELP_ASSERT: '1'
    steps:
      # No git operation in this job needs the token, so it is not left on
      # disk for the third-party install below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v7
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'

      - name: Install Python setuptools
        if: runner.os != 'Windows'
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The suite imports the Codex package, whose module graph loads node-pty;
      # as in the test job, Windows uses the shipped prebuilds and macOS and
      # Linux rebuild it. No Electron binary is needed: vitest mocks electron.
      - name: Rebuild native modules
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node -e "
          const { rebuild } = require('@electron/rebuild');
          rebuild({
            buildPath: process.cwd(),
            electronVersion: require('./node_modules/electron/package.json').version,
            onlyModules: ['node-pty', 'better-sqlite3']
          }).then(() => console.log('rebuild done')).catch(e => { console.error(e); process.exit(1) })
          "

      - name: Resolve this run's Codex version
        id: ver
        env:
          RC_VERSION: ${{ inputs.codex_rc_version }}
        run: node tests/integration/codex-conformance-ci.mjs version ${{ matrix.cli }}

      # Codex prepares its home before it parses even --version, so every run
      # of the CLI in this job gets a fresh, empty CODEX_HOME: the suite makes
      # one per run, these steps make the PATH check's and the flag-drift
      # suite's, and the last step proves the runner's own home untouched.
      - name: The runner's own Codex home, before
        run: node tests/integration/codex-conformance-ci.mjs own-home record "${{ runner.temp }}/own-codex-home.txt"

      # The package and its platform packages declare no install scripts
      # (0.153.4, 0.155.1), so none runs; the tarballs go to a cache of their
      # own, not the npm cache the job saves under the lockfile's key.
      - name: Install Codex ${{ steps.ver.outputs.version }} into its own prefix
        shell: bash
        env:
          CODEX_VERSION: ${{ steps.ver.outputs.version }}
          PREFIX: ${{ runner.temp }}/codex-${{ matrix.cli }}
          NPM_CACHE: ${{ runner.temp }}/npm-codex-cache
        run: npm install --global --prefix "$PREFIX" --ignore-scripts --cache "$NPM_CACHE" --no-audit --no-fund "@openai/codex@$CODEX_VERSION"

      - name: Locate the installed CLI
        id: bin
        run: node tests/integration/codex-conformance-ci.mjs bin "${{ runner.temp }}/codex-${{ matrix.cli }}"

      - name: Fresh Codex homes for the PATH check and the flag-drift suite
        id: homes
        run: node tests/integration/codex-conformance-ci.mjs homes onpath compat

      # The flag-drift suite skips itself when no codex is on PATH: prove the
      # install is the one PATH finds, so that suite cannot pass by skipping.
      - name: The installed CLI is the one on PATH
        shell: bash
        env:
          CODEX_VERSION: ${{ steps.ver.outputs.version }}
          CODEX_HOME: ${{ steps.homes.outputs.onpath }}
        run: |
          out="$(codex --version | tr -d '\r')"
          echo "$out"
          [ "$out" = "codex-cli $CODEX_VERSION" ] || { echo "::error::codex on PATH printed '$out', not codex-cli $CODEX_VERSION"; exit 1; }

      - name: Real-CLI conformance (the app's discovery, runner and readers)
        env:
          CCC_CODEX_CONFORMANCE_BIN: ${{ steps.bin.outputs.bin }}
          CCC_CODEX_CONFORMANCE_VERSION: ${{ steps.ver.outputs.version }}
          CCC_CODEX_CONFORMANCE_OUT: ${{ runner.temp }}/codex-conformance
        run: npx vitest run tests/integration/codex-real-cli-conformance.test.ts

      - name: Flag-drift suite against this install
        env:
          CODEX_HOME: ${{ steps.homes.outputs.compat }}
        run: npx vitest run tests/integration/codex-cli-compat.test.ts

      - name: No run of the CLI touched the runner's own Codex home
        if: ${{ !cancelled() }}
        run: node tests/integration/codex-conformance-ci.mjs own-home check "${{ runner.temp }}/own-codex-home.txt"

      - name: Upload the help captures and the run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-conformance-${{ matrix.os }}-${{ matrix.cli }}
          path: ${{ runner.temp }}/codex-conformance
          if-no-files-found: warn
          retention-days: 30

  # SSH multi-session smoke (#24 regression gate; aicc_planning#28). Real `ssh`
  # against an EPHEMERAL localhost sshd — no external hosts or credentials, so
  # unlike the manual live matrix (AGENTS.md) this CAN run in CI. It proves the
  # per-session MCP reverse-tunnel ports coexist (two sessions to one host) and
  # that the old single-fixed-port shape collides. It exercises only the SSH
  # connection / `-R` / argv layer (child_process ssh + the pure argv builder) —
  # NOT claude/tmux/statusline, which still need the manual matrix.
  #
  # ALWAYS runs on PRs (not `ci-run`-gated), so it reports on every PR event
  # and could be made a required status check.
  ssh-smoke:
    name: SSH multi-session smoke (#24)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Provision an ephemeral key-auth sshd (TCP forwarding on)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server netcat-openbsd
          # The runner account is password-locked in /etc/shadow; sshd (UsePAM no)
          # refuses locked accounts even for pubkey auth. Set a throwaway password
          # to UNLOCK it — PasswordAuthentication stays off, so it's never usable
          # for login; the ephemeral runner is discarded after the job.
          echo "$(whoami):ci-ssh-smoke-$(date +%s)" | sudo chpasswd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          D="$RUNNER_TEMP/sshd"; mkdir -p "$D"
          ssh-keygen -t ed25519 -N '' -f "$D/hostkey" -q
          cat > "$D/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $D/hostkey
          PidFile $D/sshd.pid
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PasswordAuthentication no
          PubkeyAuthentication yes
          AllowTcpForwarding yes
          UsePAM no
          StrictModes no
          LogLevel VERBOSE
          EOF
          sudo mkdir -p /run/sshd
          sudo "$(command -v sshd)" -t -f "$D/sshd_config"
          sudo "$(command -v sshd)" -f "$D/sshd_config" -E "$D/sshd.log"
          for i in $(seq 1 20); do nc -z 127.0.0.1 2222 && break; sleep 0.5; done
          nc -z 127.0.0.1 2222 || { echo "sshd failed to start"; sudo cat "$D/sshd.log" 2>/dev/null || true; exit 1; }
          # prove key auth + forwarding before the test, surfacing sshd errors early
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p 2222 "$(whoami)@127.0.0.1" 'echo SSHD_UP' || { sudo cat "$D/sshd.log" 2>/dev/null || true; exit 1; }
      - name: Write live host entry (localhost)
        run: |
          mkdir -p tests/live
          printf '{ "linuxKey": { "host": "127.0.0.1", "username": "%s", "port": 2222 } }\n' "$(whoami)" > tests/live/hosts.local.json
      - name: SSH multi-session -R test (#24)
        run: npx vitest run --config vitest.live.config.ts tests/live/ssh-multisession.live.ts
