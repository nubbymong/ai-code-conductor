# The Rust session helper (ADR-029, ADR-030). The installer ships only the release
# build of aicc-helper (2.1.3-beta.6), copied to resources/helper/. `helper/` is a
# top-level folder on purpose, outside `src/` and `resources/`, so no packaging
# glob picks up anything else (tests/unit/scripts/helper-packaging.test.ts keeps
# that true).
#
# Supply chain rules, from docs/remote/helper-threat-model.md 3.10:
#   - every dependency is pinned with an exact `=x.y.z`
#   - crates.io only: no git or path dependencies
#   - no async runtime, no TLS or HTTP crate, no JSON crate (src/json.rs is ours)
#   - under 25 crates in Cargo.lock, the helper itself included (CI counts them)
#   - Cargo.lock is committed and every build runs with --locked

# An empty workspace table makes this folder its own workspace root, so cargo
# never looks upwards for a parent workspace.
[workspace]

[package]
name = "aicc-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Per-machine session helper: frame codec, hello line, output ring, PTY holder on a local pipe or socket"

[lib]
name = "aicc_helper"
path = "src/lib.rs"

[[bin]]
name = "aicc-helper"
path = "src/main.rs"

# A tiny stand-in for the real CLI, so hold, detach, re-attach and replay can be
# tested on every OS without installing or running a real provider CLI.
[[bin]]
name = "aicc-fake-cli"
path = "src/bin/aicc-fake-cli.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.172"

# Features only switch on parts of the same crate: they add no package to
# Cargo.lock. Authorization builds and reads the pipe's security descriptor,
# Cryptography gives random endpoint names, FileSystem and IO carry the
# overlapped named pipe, JobObjects ends a session's whole process tree,
# LibraryLoader loads the bundled conpty.dll, Diagnostics_Debug keeps a
# load that fails from showing a dialog, Diagnostics_ToolHelp lists the
# processes under one that `end` ends (start.rs), and SystemInformation
# reads the time that list was read at (start.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

# The tests: the same pinned crate and feature. Diagnostics_ToolHelp lists
# processes and threads (tests/windows_orphans.rs, tests/start.rs). Since
# 2.1.3-beta.8 the release build has it too, for `end` (above).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.59.0", default-features = false, features = ["Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
strip = true
opt-level = "s"
