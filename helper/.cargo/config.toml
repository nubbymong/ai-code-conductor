# The session helper carries its own C runtime on Windows (2.1.3-beta.8 section
# C4). Rust's Windows MSVC target links the C runtime dynamically by default, so
# the program would import VCRUNTIME140.dll, which a PC without Microsoft's
# Visual C++ runtime does not have: Windows then stops it before main
# (0xC0000135) and every helper feature stays off there. +crt-static links the
# C runtime into the program instead. scripts/check-pe-imports.mjs fails CI and
# the release build if a built aicc-helper.exe still imports a C runtime DLL.
#
# Each flag also reaches the build scripts and the other programs cargo links
# here; a program that calls none of the delay-loaded DLLs only gets the
# linker's warning LNK4199 for that DLL, which changes nothing.
#
# cargo reads this file only when it runs in helper/ or below: it looks for
# .cargo/config.toml from the CURRENT folder upwards, not from Cargo.toml's
# folder. Every helper build in .github/workflows/ci.yml and release.yml runs
# with `working-directory: helper`, and tests/unit/scripts/check-pe-imports.test.ts
# keeps that true. A RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS environment variable
# replaces this setting, so no workflow sets one.
#
# The window-manager DLLs are delay-loaded (2.1.3-beta.14 section C6). Only the
# capture mode (src/capture.rs) calls user32, gdi32 and shcore (whose calls come
# through its API set name, api-ms-win-shcore-scaling-l1-1-1.dll). Imported at
# load time, they would load before main in every mode: each holder, every
# `hook` run, `mcp`, `start`, `end`, `console-hosts`, `list`, and each process
# would then start as a window-manager client. /DELAYLOAD moves them to the
# delay-load table, so Windows loads them at a capture mode's first call and no
# other mode loads them; delayimp.lib is the linker's own helper that does the
# load. user32 and gdi32 are KnownDLLs, and the API set name resolves through
# Windows' API set map to shcore.dll, a KnownDLL too, so a delayed load still
# takes Windows' own copy, never a file of that name in another folder.
# scripts/check-pe-imports.mjs fails CI and the release build if a built
# aicc-helper.exe imports any of them at load time again.
#
# The cfg matches Windows MSVC targets only: the macOS and Linux builds do not
# change.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-arg=/DELAYLOAD:user32.dll",
  "-C", "link-arg=/DELAYLOAD:gdi32.dll",
  "-C", "link-arg=/DELAYLOAD:api-ms-win-shcore-scaling-l1-1-1.dll",
  "-C", "link-arg=delayimp.lib",
]
